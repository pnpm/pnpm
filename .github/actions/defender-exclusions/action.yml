name: Defender exclusions

description: Keep Windows Defender from scanning build and test files on a Windows runner

runs:
  using: composite

  steps:
    # The runner is a throwaway VM, and the builds and tests write many files
    # under the workspace, the temp directories and the tool homes. A runner
    # without Defender only logs a warning.
    - name: Exclude build and test directories from Defender
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        try {
          Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled
          Add-MpPreference -ExclusionPath @(
            (Split-Path -Parent $env:GITHUB_WORKSPACE),
            $env:RUNNER_TEMP,
            $env:TEMP,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup'),
            (Join-Path $env:LOCALAPPDATA 'pnpm')
          )
          Add-MpPreference -ExclusionProcess @('cargo.exe', 'rustc.exe', 'sccache.exe', 'link.exe', 'cargo-nextest.exe', 'node.exe')
          (Get-MpPreference).ExclusionPath
        } catch {
          Write-Host "::warning::Defender exclusions were not applied: $_"
        }
