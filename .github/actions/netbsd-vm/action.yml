name: NetBSD VM

description: Boot a NetBSD VM with this checkout attached and Rust installed, for .github/scripts/netbsd-vm/vm.sh

runs:
  using: composite

  steps:
    # GitHub-hosted Linux runners have KVM, but the runner user cannot open
    # /dev/kvm until the device is made accessible.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install qemu
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 python3-pexpect genisoimage

    - name: Install NetBSD and boot it
      shell: bash
      run: .github/scripts/netbsd-vm/vm.sh start
