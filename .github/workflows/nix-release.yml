name: Update Nix flake

# Pins flake.nix to a newly published pnpm release: prefetches that release's
# per-platform SRI hashes, rewrites flake.nix, and opens a PR.
#
# The release job creates draft releases that a maintainer publishes by hand, so
# `release: published` is a real user event and does start workflow runs — the
# same trigger docker.yml uses to build the release's image.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to pin the flake to (e.g. v12.0.1)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Per tag: two releases published minutes apart must not cancel each other,
  # while re-publishing one tag supersedes its own in-flight run.
  group: nix-flake-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  update-flake:
    name: Bump flake to ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pnpr@<version> and prerelease tags never pin the flake, so they do not
    # need a runner at all. The script re-checks the tag it is handed.
    if: >-
      github.repository == 'pnpm/pnpm' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.release.prerelease &&
        startsWith(github.event.release.tag_name, 'v')))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Rewrite flake.nix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # system|asset-filename — one per line. The exact name of the
          # release asset for that system.
          ASSET_MAP: |
            x86_64-linux|pnpm-linux-x64.tar.gz
            aarch64-linux|pnpm-linux-arm64.tar.gz
            x86_64-darwin|pnpm-darwin-x64.tar.gz
            aarch64-darwin|pnpm-darwin-arm64.tar.gz
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, re, subprocess, urllib.request

          # Every network call gets a deadline so a hung endpoint cannot pin the
          # runner for the whole job budget.
          API_TIMEOUT = 60
          PREFETCH_TIMEOUT = 600

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              with urllib.request.urlopen(req, timeout=API_TIMEOUT) as r:
                  return json.load(r)

          def done(reason):
              print(reason)
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("BUMPED=no\n")
              raise SystemExit(0)

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          # Only a stable pnpm CLI tag pins the flake. The repository also
          # publishes prereleases and pnpr@<version> releases, and it keeps
          # older majors releasing after a new one is out — so a newer release
          # is not necessarily a newer pnpm. Matching here is also what makes
          # the tag safe to put in the API path below.
          m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if not m:
              done(f"{tag} is not a stable pnpm release tag; nothing to do.")
          new_key = tuple(int(g) for g in m.groups())
          version = tag[1:]
          src = open("flake.nix").read()
          m = re.search(r'version = "([^"]*)";', src)
          if not m:
              raise SystemExit('could not find version = "..." in flake.nix')
          current = m.group(1)
          print(f"flake.nix version: {current}  |  published release: {version}")
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current)
          if not m:
              raise SystemExit(f'flake.nix version "{current}" is not a stable X.Y.Z version')
          if new_key <= tuple(int(g) for g in m.groups()):
              done(f"flake.nix is at {current}; {version} would not move it forward.")
          release = api(f"releases/tags/{tag}")
          asset_names = {a["name"] for a in release["assets"]}
          asset_map = {}
          for line in os.environ["ASSET_MAP"].splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              sys_, asset = line.split("|", 1)
              asset_map[sys_.strip()] = asset.strip()
          # Completeness guard: detect release archives that are NOT covered by
          # ASSET_MAP. If a project ships for 4 platforms but ASSET_MAP only
          # lists 3, the omitted platform's hash goes stale while its URL still
          # gets the version bump — users on that platform get a hash mismatch.
          IGNORED = ("musl", "pnpr-", "-source", "source-code", "win32", "win-x64", "win-arm64")
          packaged = set(asset_map.values())
          unmatched = [
              name for name in sorted(asset_names)
              if name.endswith((".tar.gz", ".zip"))
              and name not in packaged
              and not any(ign in name.lower() for ign in IGNORED)
          ]
          if unmatched:
              plats = ", ".join(unmatched)
              raise SystemExit(
                  f"RELEASE ASSET COMPLETENESS CHECK FAILED: release {tag} has "
                  f"platform archives not covered by ASSET_MAP: {plats}. "
                  f"Add them to ASSET_MAP or the hash for those platforms will "
                  f"go stale while the URL gets the version bump — users on the "
                  f"omitted platform get a hash mismatch. ASSET_MAP currently "
                  f"covers: {sorted(asset_map.keys())}")
          src, n = re.subn(r'version = "[^"]*";', f'version = "{version}";', src, count=1)
          if n != 1:
              raise SystemExit('could not find version = "..." in flake.nix')
          for sys_, asset in asset_map.items():
              if asset not in asset_names:
                  raise SystemExit(f"no asset {asset} for {sys_} in {tag}; have: {sorted(asset_names)}")
              url = f"https://github.com/{repo}/releases/download/{tag}/{asset}"
              expected = None
              if f"{asset}.sha256" in asset_names:
                  with urllib.request.urlopen(f"{url}.sha256", timeout=API_TIMEOUT) as r:
                      expected = "sha256:" + r.read().decode().split()[0]
              out = json.loads(subprocess.check_output(
                  ["nix", "store", "prefetch-file", "--json", "--hash-type", "sha256"]
                  + (["--expected-hash", expected] if expected else [])
                  + [url],
                  timeout=PREFETCH_TIMEOUT))
              sri = out["hash"]
              pat = re.compile(r'("' + re.escape(sys_) + r'" = \{[^}]*\})', re.S)
              # Asset names and SRI hashes are substituted through a replacement
              # function: as a replacement *string* a backslash escape in either
              # would be expanded rather than written out.
              def repl(m):
                  b = m.group(1)
                  b = re.sub(r'file = "[^"]*";', lambda _: f'file = "{asset}";', b, count=1)
                  b = re.sub(r'sha256 = "[^"]*";', lambda _: f'sha256 = "{sri}";', b, count=1)
                  return b
              src, n = pat.subn(repl, src, count=1)
              if n != 1:
                  raise SystemExit(f"could not find assets block for {sys_} in flake.nix")
          open("flake.nix", "w").write(src)
          # Written last: the Open PR step must not be armed by a run that then
          # failed to produce the rewrite it would commit.
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("BUMPED=yes\n")
              f.write(f"VERSION={version}\n")
          print(f"bumped flake.nix to {version}: {list(asset_map)}")
          PYEOF

      - name: Open PR
        if: env.BUMPED == 'yes'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(nix): bump flake to v${{ env.VERSION }}"
          title: "chore(nix): bump flake to v${{ env.VERSION }}"
          branch: chore/nix-flake-v${{ env.VERSION }}
          base: main
          body: |
            Auto-generated by the `Update Nix flake` workflow when v${{ env.VERSION }}
            was published. This PR bumps `version` and refreshes the per-platform SRI
            hashes by prefetching the new release assets.

            Note: PRs opened by `GITHUB_TOKEN` do not trigger downstream workflow runs (e.g. CI),
            so this PR will show no checks. Review the diff before merging — it should be a
            version bump plus per-platform hash refresh with no source changes.
