name: Build pnpr-prepare (reusable)

# Build the registry fixture preparer once for the given OS, from the pnpr
# release the catalog pins, then share it with every test job/shard as an
# artifact. The tests run the published `@pnpm/pnpr` server of the same
# release.
#
# This is a per-OS reusable workflow rather than a single matrix job so each
# platform's test jobs can gate on their own build. `needs` can only target a
# whole job, never an individual matrix leg.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-pnpr:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    steps:
    - name: Checkout Commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Read the pinned pnpr version
      id: pnpr
      shell: bash
      run: echo "version=$(node -e "import('./pnpm11/__utils__/jest-config/with-registry/pnprPrepare.js').then(m => console.log(m.pnprVersion()))")" >> "$GITHUB_OUTPUT"
    - name: Restore pnpr-prepare
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pnpr-prepare
        key: pnpr-prepare-${{ runner.os }}-${{ steps.pnpr.outputs.version }}
    - name: Build pnpr-prepare
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        node pnpm11/__utils__/jest-config/with-registry/pnprPrepare.js
    # Save right after the build, so a later failing step cannot skip it.
    - name: Save pnpr-prepare
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pnpr-prepare
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Upload pnpr-prepare
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pnpr-bins-${{ runner.os }}
        path: .pnpr-prepare
        # `.pnpr-prepare` is a dotfile dir, which upload-artifact skips by default.
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
