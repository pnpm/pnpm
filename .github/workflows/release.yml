name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      id-token: write  # Required for OIDC
      contents: write  # for softprops/action-gh-release to create GitHub release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install ldid
        run: |
          sudo apt-get update
          sudo apt-get install git build-essential libplist-dev libssl-dev openssl qemu-user-binfmt pkg-config
          cd /tmp
          git clone https://github.com/ProcursusTeam/ldid.git
          cd ldid
          git checkout c2f8abf013b22c335f44241a6a552a7767e73419
          git submodule update --init
          gcc -I. -c -o lookup2.o lookup2.c
          g++ -std=c++11 -o ldid lookup2.o ldid.cpp -I. -lcrypto $(pkg-config --cflags --libs libplist-2.0) -lxml2
          sudo mv ldid /usr/local/bin
      - name: Install pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          standalone: true
      # npm trusted publishing (OIDC) needs Node 22.14 or newer. On an older
      # Node, npm silently falls back to NPM_TOKEN and the packages lose their
      # trusted-publisher evidence, which is what happened to 10.34.0-10.34.5.
      - name: Setup Node for npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Remember the Node for npm
        run: echo "NODE_FOR_NPM=$(command -v node)" >> "$GITHUB_ENV"
      # Pin Node to the latest version still compatible with `esm@3.2.25`,
      # which is pulled in transitively by `publish-packed` and crashes the
      # `pnpm/bundle.ts` step on the runner's default Node. See #11988 /
      # release 10.34.0 incident for context. Only npm runs on the newer Node.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: npm install
        run: pnpm install --global npm@11.6.2
      # `pnpm publish` runs the lifecycle scripts itself and calls
      # `npm publish --ignore-scripts`, so pointing npm-path at this wrapper
      # moves only the upload to the newer Node.
      - name: Create npm wrapper for trusted publishing
        run: |
          npm_cli="$(pnpm root -g)/npm/bin/npm-cli.js"
          test -f "$npm_cli"
          "$NODE_FOR_NPM" -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) { console.error(`npm trusted publishing needs Node 22.14+, got ${process.version}`); process.exit(1) }'
          wrapper="$RUNNER_TEMP/npm-trusted-publishing"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$NODE_FOR_NPM" "$npm_cli" > "$wrapper"
          chmod +x "$wrapper"
          echo "NPM_FOR_PUBLISH=$wrapper" >> "$GITHUB_ENV"
      - name: pnpm install
        # We use --force because we want all artifacts of @reflink/reflink to be installed.
        run: pnpm install --force
      # Release gate: a stale embedded key set would make pnpm unable to verify
      # packages signed with npm's rotated key, so block the release until the
      # embedded keys are refreshed.
      - name: Check embedded npm signing keys are in sync with the npm registry
        run: pnpm run check:npm-signing-keys
      - name: Check embedded Node.js release keys are in sync with nodejs/release-keys
        run: pnpm run check:node-release-keys
      - name: Publish Packages
        env:
          # setting the "npm_config_//registry.npmjs.org/:_authToken" env variable directly doesn't work.
          # probably "pnpm release" doesn't pass auth tokens to child processes
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_npm_path: ${{ env.NPM_FOR_PUBLISH }}
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}" # pnpm config set is broken
          pnpm release
      - name: Copy Artifacts
        run: pnpm run copy-artifacts
      - name: Generate release description
        run: pnpm run make-release-description
      - name: Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          draft: true
          files: dist/*
          body_path: RELEASE.md
      # A token-published release breaks projects that pin it with
      # `trustPolicy: no-downgrade`, so fail loudly if npm fell back to the token.
      - name: Verify the pnpm packages were published by the trusted publisher
        run: |
          version=$(jq -r .version pnpm/package.json)
          status=0
          for name in pnpm @pnpm/exe $(jq -r '.optionalDependencies | keys[]' pnpm/artifacts/exe/package.json); do
            if ! npm view "$name@$version" _npmUser.trustedPublisher.id --registry https://registry.npmjs.org/ | grep -qx github; then
              echo "::error::$name@$version was not published by the trusted publisher"
              status=1
            fi
          done
          exit $status
