name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      id-token: write  # Required for OIDC
      contents: write  # for softprops/action-gh-release to create GitHub release
    runs-on: ubuntu-latest
    environment: release
    env:
      # pnpm 10 never used the global virtual store in CI. With it, pnpm 12 adds
      # an ESM loader to NODE_OPTIONS, and on Node 20 that stops ts-node from
      # running the build scripts.
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install ldid
        run: |
          sudo apt-get update
          sudo apt-get install git build-essential libplist-dev libssl-dev openssl qemu-user-binfmt pkg-config
          cd /tmp
          git clone https://github.com/ProcursusTeam/ldid.git
          cd ldid
          git checkout c2f8abf013b22c335f44241a6a552a7767e73419
          git submodule update --init
          gcc -I. -c -o lookup2.o lookup2.c
          g++ -std=c++11 -o ldid lookup2.o ldid.cpp -I. -lcrypto $(pkg-config --cflags --libs libplist-2.0) -lxml2
          sudo mv ldid /usr/local/bin
      # Pin Node to the latest version still compatible with `esm@3.2.25`,
      # which is pulled in transitively by `publish-packed` and crashes the
      # `pnpm/bundle.ts` step on the runner's default Node. See #11988 /
      # release 10.34.0 incident for context. pnpm 12 publishes through npm's
      # trusted publishing (OIDC) itself, so the Node version doesn't matter
      # for the upload.
      - name: Install pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@20
          install: false
      # The release has to bundle every artifact of @reflink/reflink.
      - name: pnpm install
        run: pnpm install --os=current,darwin,win32 --cpu=current,x64,arm64
      # Release gate: a stale embedded key set would make pnpm unable to verify
      # packages signed with npm's rotated key, so block the release until the
      # embedded keys are refreshed.
      - name: Check embedded npm signing keys are in sync with the npm registry
        run: pnpm run check:npm-signing-keys
      - name: Check embedded Node.js release keys are in sync with nodejs/release-keys
        run: pnpm run check:node-release-keys
      # `pnpm`, `@pnpm/exe` and the platform packages publish without a token, so
      # a failed OIDC exchange fails the release instead of silently falling back
      # to NPM_TOKEN, which is what happened to 10.34.0-10.34.5. Projects that pin
      # a token-published release with `trustPolicy: no-downgrade` reject it.
      # `@pnpm/exe` goes first because its prepublishOnly script builds the
      # binaries the platform packages ship.
      - name: Publish @pnpm/exe (OIDC)
        run: pnpm --filter=@pnpm/exe publish --tag=next-10 --access=public
      - name: Publish platform packages (OIDC)
        run: pnpm --filter='./pnpm/artifacts/*' --filter='!@pnpm/exe' publish --tag=latest-10 --access=public
      - name: Publish internal workspace packages (static token)
        # The other workspace packages don't have trusted publishing configured
        # on npm. The token is removed at the end of the step so it can't reach
        # the pnpm publication below.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          trap 'pnpm config delete "//registry.npmjs.org/:_authToken" || true' EXIT
          pnpm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
          pnpm publish --filter='!pnpm' --filter='!./pnpm/artifacts/*' --tag=latest-10 --access=public
      - name: Publish pnpm (OIDC)
        run: pnpm --filter=pnpm publish --tag=next-10 --access=public
      - name: Copy Artifacts
        run: pnpm run copy-artifacts
      - name: Generate release description
        run: pnpm run make-release-description
      - name: Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          draft: true
          files: dist/*
          body_path: RELEASE.md
