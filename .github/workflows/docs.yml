name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/sync-docs.yml'
      - '.github/scripts/prepare-docs-sync*.mjs'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/sync-docs.yml'
      - '.github/scripts/prepare-docs-sync*.mjs'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pnpm/pnpm.io
          ref: 484ddc510b4e80279392f4b70d690b67a98ada47 # pnpm.io documentation importer
          path: website
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          install: false
      - name: Test release source validation
        run: node --test .github/scripts/prepare-docs-sync.test.mjs
      - name: Build the website with this PR's documentation
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          node scripts/sync-docs.mjs .. --preview
          pnpm build
          pnpm check-urls
