name: Documentation

on:
  pull_request:
    paths:
      - 'pnpm/docs/**'
      - 'pnpr/docs/**'
      - 'DOCUMENTATION.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/sync-docs.yml'
      - '.github/scripts/prepare-docs-sync*.mjs'
      - '.github/scripts/copy-docs-artifact*.mjs'
  push:
    branches: [main]
    paths:
      - 'pnpm/docs/**'
      - 'pnpr/docs/**'
      - 'DOCUMENTATION.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/sync-docs.yml'
      - '.github/scripts/prepare-docs-sync*.mjs'
      - '.github/scripts/copy-docs-artifact*.mjs'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pnpm/pnpm.io
          ref: 29f86c5f4170e6fc0477c5ef90b4d8160f8902aa # pnpm.io documentation importer
          path: website
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          install: false
      - name: Test release source validation
        run: node --test .github/scripts/prepare-docs-sync.test.mjs .github/scripts/copy-docs-artifact.test.mjs
      - name: Build the website with this PR's documentation
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          node scripts/sync-docs.mjs .. --preview 12.x pnpr
          pnpm build
          pnpm check-urls
