name: RPM

# Packages the released standalone Linux x64 build as an RPM for RED OS 8 and
# other RHEL 8 derivatives, together with a dnf repository that installs it on
# hosts with no network access at all.
#
# The artifacts are not attached to the GitHub release: releases here are
# immutable once published, so nothing can be added to them afterwards. Grab
# them from this run's artifacts instead.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "pnpm version to package (without leading v)"
        required: true

permissions: {}

env:
  # Refresh periodically: resolve with
  #   docker buildx imagetools inspect almalinux:8 --format '{{.Manifest.Digest}}'
  RHEL8_IMAGE: almalinux:8@sha256:4a87d2615a770506e204c27d6248ac97f4df67f4e41e2e9c47c81f0ed0be98cb

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      # `gh attestation verify` reads the release tarball's build provenance.
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          case "$version" in
            *[!0-9A-Za-z.+-]*) echo "invalid version: $version" >&2; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the release tarball and verify its provenance
        # The release workflow attests every archive it uploads. Verifying here
        # is what keeps a substituted tarball from being republished as an
        # official RPM, which no later check would catch.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern pnpm-linux-x64.tar.gz --output pnpm-linux-x64.tar.gz
          gh attestation verify pnpm-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Build the RPM and the dnf repository
        # Built inside RHEL 8 rather than on the runner: the repository has to
        # carry the runtime dependencies the target is missing, and only a RHEL 8
        # system can tell dnf which those are.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$PWD:/src" -w /src "$RHEL8_IMAGE" bash -euc '
            dnf install -y -q rpm-build createrepo_c dnf-plugins-core binutils tar
            packaging/rpm/build.sh "$VERSION" pnpm-linux-x64.tar.gz
          '

      - name: Install it the way an offline RED OS 8 host will
        # AlmaLinux 8 is the closest public stand-in for RED OS 8: same RHEL 8
        # base, same glibc 2.28, same rpm 4.14. `--network none` and the
        # disabled distribution repositories are the point of the test — they
        # are what proves the repository needs nothing but itself.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm --network none -e VERSION \
            -v "$PWD/dist/rpm/repo:/opt/pnpm-repo:ro" "$RHEL8_IMAGE" bash -euc '
            cp /opt/pnpm-repo/pnpm.repo /etc/yum.repos.d/
            dnf install -y --disablerepo="*" --enablerepo=pnpm pnpm
            installed=$(pnpm --version)
            test "$installed" = "$VERSION" || {
              echo "pnpm version mismatch: expected $VERSION, got $installed" >&2
              exit 1
            }
          '

      - name: Upload the RPM and the dnf repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-rpm-${{ steps.meta.outputs.version }}-x86_64
          path: |
            dist/rpm/*.rpm
            dist/rpm/*.tar.gz
          if-no-files-found: error
