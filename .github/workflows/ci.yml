name: TS CI

on:
  # Run push CI only on the default branch. A branch that lives in this repo
  # fires both a `push` and a `pull_request` event for the same commit, and
  # both runs report the `TS CI / Success` context to that commit. Branch
  # protection then sees two results for the required check, so a cancellation
  # or flake on the push side blocks the PR even when the pull_request run passed.
  # Restricting push to `main` means PRs carry `TS CI / Success` only via
  # their `pull_request` run (and the merge queue via `merge_group`); `main`
  # is validated pre-merge by `merge_group` and re-checked post-merge here.
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: TS CI / Detect Changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.force.outputs.ts || steps.filter.outputs.ts }}
      changesets: ${{ steps.filter.outputs.changesets }}
      githooks: ${{ steps.force.outputs.ts || steps.filter.outputs.githooks }}
    steps:
      # In the merge queue the full suite must run: `TS CI / Compile & Lint`
      # is itself a required check, and a skipped job never reports its
      # context, which would leave the queue waiting forever. Forcing
      # detection true also tests the merged result, which is the point of
      # the queue.
      - name: Force TS CI for merge queue
        if: github.event_name == 'merge_group'
        id: force
        run: echo "ts=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'merge_group' && github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'merge_group'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          # The workspace-root lint, the CI and release scripts, and the
          # TypeScript packages that remain on this branch.
          filters: |
            ts:
              - '.meta-updater/**'
              - '.config/pnpm/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'eslint.config.mjs'
              - 'tsconfig.lint.json'
              - '.config/cspell.json'
              - 'pnpm/npm/get-pnpm/**'
              - 'pnpm/crates/deps-restorer/pnp-runtime/**'
              - 'pnpm/crates/deps-restorer/src/pnp_exports.cjs.inc'
              - 'pnpr/examples/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            # Skill scripts under .agents/ ship their own *.test.sh, run by the
            # Compile & Lint job next to the publication scripts above.
              - '.agents/skills/**/scripts/**'
            # A pending change intent is validated by `pn lint`, which runs in
            # Compile & Lint. Nothing under .changeset/ can affect a test, so
            # it gates that job alone.
            changesets:
              - '.changeset/**'
            # The git hooks' tests need neither a dependency install nor a
            # compile, so a hook-only change runs them alone rather than
            # starting the TypeScript suite.
            githooks:
              - '.config/githooks/**'
              - '.github/workflows/ci.yml'

  compile-and-lint:
    needs: changes
    # Run when lint-relevant files changed, or when the PR only touches
    # .changeset/ — `pn lint` validates the pending change intents and their
    # spelling.
    if: ${{ !cancelled() && (needs.changes.outputs.ts == 'true' || needs.changes.outputs.changesets == 'true') }}

    name: TS CI / Compile & Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - name: Checkout Commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize Rust before dependency installation
      uses: $/.github/actions/rustup
      with:
        restore-cache: false
    - name: Install pnpm
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        install: false
    - name: Test CI and release publication scripts
      run: |
        .github/scripts/npm-package-publication-state.test.sh
        .github/scripts/npm-staged-publication.test.sh
        .github/scripts/issue-fix-intent.test.sh
        .github/scripts/docker-image-tags.test.sh
        .agents/skills/pull-requests/scripts/resolve-pr-conflicts.test.sh
        node --test .github/scripts/bump.test.mjs .github/scripts/assert-stripped.test.mjs .github/scripts/assert-windows-crt-static.test.mjs .github/scripts/update-npm-signing-keys.test.mjs
    - name: Test Cloudflare cache policy example
      run: node --test pnpr/examples/cloudflare/*.test.mjs
    - name: Lint
      run: pn pipeline lint --include-workspace-root --full --no-cache
    - name: Check the embedded PnP resolver
      run: pn --filter @pnpm-private/pnp-runtime check

  test-git-hooks:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.githooks == 'true' }}
    name: TS CI / Test Git Hooks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Checkout Commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        runtime: node@22
        install: false
    - name: Test git hook scripts
      run: node --test .config/githooks/*.test.mjs

  # Single aggregate gate — the only TS CI context branch protection needs
  # to require. Listing the individual jobs as required checks does not
  # work: they skip on non-TypeScript PRs, and a matrix job skipped at the
  # job level never expands its `${{ matrix.* }}` name, so the per-platform
  # contexts it would report never appear and the PR blocks forever waiting
  # for them. This job always runs (it reports under a static name in every
  # state) and fails only if a dependency actually failed or was cancelled —
  # skipped dependencies count as a pass.
  success:
    name: TS CI / Success
    if: ${{ always() }}
    needs:
      - changes
      - compile-and-lint
      - test-git-hooks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
