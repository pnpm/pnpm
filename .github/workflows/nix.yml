name: Nix flake

# Validates the flake (flake.nix). Runs on PRs that touch flake files, on
# pushes to main that touch them, and on manual dispatch.
#
# Steps, in order of what they catch:
#   1. nix flake check --all-systems  — every system's outputs evaluate
#      (including darwin on an ubuntu runner).
#   2. nix build .#default            — fetchurl + autoPatchelf + install
#      layout actually realises for the runner's system. One runner per
#      system flake.nix declares, so every published platform is built.
#   3. nix run .#default -- --version — the patched binary actually execs.
#      This is the only step that catches an output that evaluates and builds
#      but points at the wrong program. It cannot run on pull_request (see the
#      step's own comment), so a merge to main is where it runs for real.

on:
  workflow_dispatch: {}
  # GitHub Actions does not support YAML anchors, so the two path lists are
  # spelled out; keep them identical.
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix.yml"

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One per system in flake.nix. Blacksmith covers x86_64-linux and
        # aarch64-darwin; the other two have no Blacksmith equivalent, so
        # they use GitHub's native runners.
        runner:
          - blacksmith-8vcpu-ubuntu-2404  # x86_64-linux
          - ubuntu-24.04-arm              # aarch64-linux
          - blacksmith-12vcpu-macos-latest # aarch64-darwin
          - macos-15-intel                # x86_64-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: nix flake check --all-systems
        # --no-build: evaluate every system's outputs (including darwin on
        # ubuntu) without realising them. Without --no-build, `nix flake
        # check` builds every derivation in `checks`, which fails for
        # non-native systems (darwin stdenv can't run on linux). The
        # build/run steps below handle realisation for the runner's system.
        run: nix flake check --all-systems --no-build

      - name: nix build .#default
        run: nix build .#default --print-build-logs

      - name: nix run .#default -- --version
        # SECURITY: Gate behind non-PR events. `nix run` executes the built
        # binary outside the Nix sandbox on the runner, where it can reach
        # GitHub's OIDC endpoint and the GITHUB_TOKEN. On a PR, that binary
        # could be PR-controlled (a malicious PR could change the fetchurl
        # hash to point at a malicious binary). `nix build` above is safe
        # (realises inside the sandbox, no network).
        if: github.event_name != 'pull_request'
        run: nix run .#default -- --version
