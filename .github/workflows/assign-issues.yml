name: Assign New Issues

# Assigns a new issue to its author when they tick the issue form's "I am
# working on a fix" checkbox, and to the maintainer otherwise. An author who
# ticks the checkbox in a later edit is added as an assignee.

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  assign:
    name: Assign the issue
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event.issue.user.type != 'Bot'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assign the author or the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER: zkochan
          ACTION: ${{ github.event.action }}
          # Passed as env, never inlined into the script, so the free-form
          # bodies cannot be interpreted as shell code.
          ISSUE_BODY: ${{ github.event.issue.body }}
          BODY_CHANGED: ${{ github.event.changes.body != null }}
          PREVIOUS_BODY: ${{ github.event.changes.body.from }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: .github/scripts/assign-issue.sh
