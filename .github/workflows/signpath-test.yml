# Temporary: proves the SignPath setup before release.yml depends on it.
# Delete before merging.
name: SignPath test

on:
  push:
    branches:
      - sign-path

permissions: {}

jobs:
  sign:
    runs-on: windows-2025
    environment: signpath
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize Rust
        uses: $/.github/actions/rustup
        with:
          restore-cache: false

      - name: Install crates
        uses: $/.github/actions/install-crates

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked -p pnpm-cli --bin pnpm --release --target=x86_64-pc-windows-msvc

      - name: Stage unsigned binary
        shell: bash
        run: |
          mkdir unsigned
          mv target/x86_64-pc-windows-msvc/release/pnpm.exe unsigned/pnpm.exe

      - name: Upload unsigned binary
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: unsigned-pnpm-win32-x64
          path: unsigned/pnpm.exe

      - name: Sign binary
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ID }}
          project-slug: ${{ secrets.SIGNPATH_SLUG }}
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Check the binary is signed
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signed/pnpm.exe
          if (-not $signature.SignerCertificate) {
            throw "signed/pnpm.exe carries no Authenticode signature"
          }
          $signature.SignerCertificate | Format-List Subject, Issuer, NotAfter
          # Outside the checkout, so the repository's packageManager pin does
          # not hand off to another pnpm.
          $exe = Resolve-Path signed/pnpm.exe
          Push-Location $env:RUNNER_TEMP
          & $exe --version
          Pop-Location

      - name: Upload signed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: signed-pnpm-win32-x64
          path: signed/pnpm.exe
