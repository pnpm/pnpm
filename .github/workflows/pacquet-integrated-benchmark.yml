name: Pacquet Integrated-Benchmark

on:
  workflow_dispatch:
  push:
    # Update Bencher's baselines whenever something that could move
    # install perf lands on main. This one benchmark drives two testbeds:
    # `pacquet` (the direct install) and `pnpr` (the same client through
    # the pnpr install accelerator). The pnpr server is built from the
    # `pacquet-*` resolver/store/tarball crates, so a pacquet change can
    # move both — hence one shared trigger surface (`pnpm/**` + the
    # workspace infra) plus `pnpr/**` for the server itself. Paths mirror
    # the pull_request filter below.
    branches: [main]
    paths:
      - 'pnpm/**/*.rs'
      - 'pnpm/**/Cargo.toml'
      - 'pnpr/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'justfile'
      - 'pnpm/tasks/registry-mock/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'pnpm/tasks/integrated-benchmark/src/fixtures/**'
      - '.github/actions/rustup/**'
      - '.github/actions/binstall/**'
      - '.github/actions/install-crates/**'
      - '.github/workflows/pacquet-integrated-benchmark.yml'
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'pnpm/**/*.rs'
      - 'pnpm/**/Cargo.toml'
      - 'pnpr/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'justfile'
      - 'pnpm/tasks/registry-mock/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'pnpm/tasks/integrated-benchmark/src/fixtures/**'
      - '.github/actions/rustup/**'
      - '.github/actions/binstall/**'
      - '.github/actions/install-crates/**'
      - '.github/workflows/pacquet-integrated-benchmark.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# This workflow runs in the PR's privilege context, which is read-only for
# fork PRs (GitHub Actions security policy). The result is uploaded as an
# artifact and posted by `integrated-benchmark-comment.yml`, which runs in
# the base-repo privilege context via `workflow_run`.
permissions:
  contents: read

jobs:
  revisions:
    name: Resolve benchmark revisions
    runs-on: blacksmith-8vcpu-ubuntu-2404
    outputs:
      head_sha: ${{ steps.revs.outputs.head_sha }}
      main_sha: ${{ steps.revs.outputs.main_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions once for all runners
        id: revs
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

  build:
    needs: revisions
    name: Build ${{ matrix.revision }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-ubuntu-2404]
        revision: ${{ fromJSON(github.ref_name == 'main' && '["HEAD"]' || '["HEAD", "main"]') }}
    runs-on: ${{ matrix.os }}
    env:
      REVISION: ${{ matrix.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'main' && needs.revisions.outputs.main_sha || needs.revisions.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cache revision binaries
        id: binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: integrated-benchmark-bin-${{ matrix.os }}-${{ matrix.revision == 'main' && needs.revisions.outputs.main_sha || needs.revisions.outputs.head_sha }}-${{ hashFiles('rust-toolchain.toml') }}
          path: |
            bench-work-env/pnpr@${{ matrix.revision }}/pacquet/target/release/pnpm
            bench-work-env/pnpr@${{ matrix.revision }}/pacquet/target/release/pacquet
            bench-work-env/pnpr@${{ matrix.revision }}/pacquet/target/release/pnpr
        timeout-minutes: 2
        continue-on-error: true

      - name: Cache Rust deps
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: integrated-benchmark-deps-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ matrix.revision }}
          restore-keys: |
            integrated-benchmark-deps-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
            integrated-benchmark-deps-${{ matrix.os }}-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
        timeout-minutes: 3
        continue-on-error: true

      - name: Install Rust Toolchain
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: $/.github/actions/rustup
        with:
          restore-cache: false
          save-cache: false

      - name: Install crates
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: $/.github/actions/install-crates

      - name: Build client and pnpr server
        if: steps.binaries.outputs.cache-hit != 'true'
        timeout-minutes: 50
        shell: bash
        run: |
          client=$(cargo metadata --no-deps --format-version=1 | jq -er '
            [.packages[].targets[] | select(.kind | index("bin")) | .name
              | select(. == "pnpm" or . == "pacquet")]
            | if length == 1 then .[0] else error("expected one pnpm CLI binary") end')
          cargo build --release --bin="$client" --bin=pnpr
          release="bench-work-env/pnpr@$REVISION/pacquet/target/release"
          mkdir -p "$release"
          rm -f "$release/pnpm" "$release/pacquet"
          cp "target/release/$client" target/release/pnpr "$release/"

      # Tar preserves executable permissions when artifacts cross runners.
      - name: Pack revision binaries
        shell: bash
        run: |
          release="bench-work-env/pnpr@$REVISION/pacquet/target/release"
          client=pnpm
          if [ ! -f "$release/$client" ]; then
            client=pacquet
          fi
          test -x "$release/$client"
          test -x "$release/pnpr"
          files=("$release/$client" "$release/pnpr")
          if [ "$REVISION" = HEAD ]; then
            mkdir -p target/release
            cp "$release/pnpr" target/release/pnpr
            files+=(target/release/pnpr)
          fi
          tar -cf "revision-$REVISION.tar" "${files[@]}"

      - name: Upload revision binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrated-benchmark-bin-${{ matrix.os }}-${{ matrix.revision }}
          path: revision-${{ matrix.revision }}.tar
          if-no-files-found: error
          retention-days: 1

  executor:
    needs: revisions
    name: Build benchmark executor
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revisions.outputs.head_sha }}
          persist-credentials: false

      - name: Cache Rust deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: integrated-benchmark-deps-blacksmith-8vcpu-ubuntu-2404-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-executor
          restore-keys: |
            integrated-benchmark-deps-blacksmith-8vcpu-ubuntu-2404-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
            integrated-benchmark-deps-blacksmith-8vcpu-ubuntu-2404-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
        timeout-minutes: 3
        continue-on-error: true

      - name: Install Rust Toolchain
        uses: $/.github/actions/rustup
        with:
          restore-cache: false
          save-cache: false

      - name: Install crates
        uses: $/.github/actions/install-crates

      - name: Build the benchmark executor
        timeout-minutes: 30
        run: cargo build --bin=integrated-benchmark

      - name: Pack benchmark executor
        run: tar -cf executor.tar target/debug/integrated-benchmark

      - name: Upload benchmark executor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrated-benchmark-bin-blacksmith-8vcpu-ubuntu-2404-executor
          path: executor.tar
          if-no-files-found: error
          retention-days: 1

  benchmark:
    needs: [revisions, build, executor]
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-ubuntu-2404] # windows is skipped because of complexity, macOS is skipped because of inconsistency
        # Each runner measures all revisions for one scenario.
        scenario:
          - isolated-linker.fresh-restore.cold-cache.cold-store
          - isolated-linker.fresh-restore.hot-cache.hot-store
          - isolated-linker.repeat-install.hot-cache.hot-store
          - isolated-linker.repeat-install.cold-cache.hot-store
          - isolated-linker.fresh-install.cold-cache.cold-store
          - isolated-linker.fresh-install.hot-cache.hot-store
          - isolated-linker.fresh-install.cold-cache.hot-store
          - isolated-linker.fresh-resolve.hot-cache.offline
          - isolated-linker.peer-heavy-resolve.hot-cache.offline
          - isolated-linker.fresh-restore.cold-cache.cold-store.cold-pnpr
          - gvs-linker.fresh-restore.hot-cache.hot-store
    name: ${{ matrix.scenario }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # On main, HEAD *is* main — comparing them is wasted work, so the
      # benchmark runs a single revision per tool and uploads it to
      # Bencher as the new baseline. On every other ref (PRs and
      # workflow_dispatch from a non-main branch), compare HEAD against
      # main so the report shows the relative shift.
      #
      # Every regular scenario runs both tools: `pacquet@<rev>` (direct install)
      # and `pnpr@<rev>` (the same client through the pnpr install
      # accelerator, against a warm long-running server). The cold-store
      # scenarios wipe the *client* store between iterations while the
      # server stays warm — i.e. pnpr's cold-client-vs-warm-server shape,
      # the realistic CI case. Running both tools in one hyperfine
      # invocation also yields the pnpr-vs-direct ratio per scenario.
      BENCHMARK_TARGETS: ${{ github.ref_name == 'main' && 'pacquet@HEAD pnpr@HEAD' || 'pacquet@HEAD pacquet@main pnpr@HEAD pnpr@main' }}
      # The peer-heavy resolver case compares the PR against both main and the
      # TypeScript CLI. It does not include pnpr because the timed offline
      # command exercises client-side peer resolution rather than server or
      # tarball performance.
      PEER_HEAVY_BENCHMARK_TARGETS: ${{ github.ref_name == 'main' && 'pacquet@HEAD pnpm@HEAD' || 'pacquet@HEAD pacquet@main pnpm@HEAD' }}
      BENCHMARK_BUILD_TARGETS: ${{ github.ref_name == 'main' && 'pacquet@HEAD pnpr@HEAD' || 'pacquet@HEAD pacquet@main pnpr@HEAD pnpr@main' }}
      # Network emulation so both install strategies cross the link they
      # would in production instead of free loopback (~GB/s, ~0 RTT), which
      # would hide every download cost.
      #
      # `PNPR_LATENCY_MS` is the round-trip latency between the client and
      # each `pnpr@<rev>` server. `REGISTRY_LATENCY_MS` +
      # `REGISTRY_BANDWIDTH_MBPS` define the link to the registry, applied
      # to *every* client that touches it — direct `pacquet@<rev>` /
      # `pnpm` installs, the pnpr server's resolution, and the pnpr
      # client's tarball fetches alike — because a request to the
      # registry-mock should cost the same regardless of who makes it.
      # pnpr's win then comes from fewer client round trips (one
      # `PNPR_LATENCY_MS` hop to the server), not a faster registry link;
      # set `PNPR_LATENCY_MS == REGISTRY_LATENCY_MS` to keep the
      # pnpr-vs-direct ratio fair. Bandwidth is per-connection; latency
      # dominates small packages, bandwidth dominates large ones. The
      # ~200 Mbit/s default matches the public npm registry's measured
      # ~190 Mbit/s (~24 MB/s) peak; lower either value if the cold-store
      # scenarios' refetch waterfall strains the per-step timeouts.
      PNPR_LATENCY_MS: 50
      REGISTRY_LATENCY_MS: 50
      REGISTRY_BANDWIDTH_MBPS: 200
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revisions.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin main branch
        env:
          MAIN_SHA: ${{ needs.revisions.outputs.main_sha }}
        run: git branch --force main "$MAIN_SHA"

      - name: Cache pnpm-registry storage
        # Peer-heavy uses hosted fixtures and never populates the npm proxy cache.
        if: matrix.scenario != 'isolated-linker.peer-heavy-resolve.hot-cache.offline'
        # Persists pnpm-registry's `--storage` dir across CI runs so
        # cold-cache benchmark scenarios don't refetch ~2.3k unscoped
        # packages from npmjs on every run. Replaces the older
        # `~/.local/share/verdaccio/storage` cache from when the mock
        # was Node + Verdaccio. Path matches `runtime_storage()` in
        # `pnpm/tasks/registry-mock/src/dirs.rs` (defaults to
        # `$HOME/.cache/pnpm-registry/storage`).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The version segment (v3) discards the persisted storage when it
          # goes internally inconsistent — e.g. a cached packument declaring
          # a version whose tarball was never cached, which 404s every
          # fresh-install run. Bump it to repopulate from a clean slate.
          key: integrated-benchmark-pnpm-registry-v3-${{ hashFiles('pnpm/tasks/integrated-benchmark/src/fixtures/pnpm-lock.yaml') }}
          restore-keys: |
            integrated-benchmark-pnpm-registry-v3-
          path: |
            ~/.cache/pnpm-registry/storage
        timeout-minutes: 1
        continue-on-error: true

      - name: Download revision binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integrated-benchmark-bin-${{ matrix.os }}-*
          path: revision-binaries
          merge-multiple: true

      - name: Unpack revision binaries
        shell: bash
        run: |
          for archive in revision-binaries/*.tar; do
            tar -xf "$archive"
          done

      - name: Install Rust Toolchain
        uses: $/.github/actions/rustup
        with:
          shared-key: integrated-benchmark
          restore-cache: false # it's insufficient
          save-cache: false # it's insufficient

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: integrated-benchmark-pnpm-v11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            integrated-benchmark-pnpm-v11-
          path: |
            ${{ env.PNPM_HOME }}/store/v11
        timeout-minutes: 1
        continue-on-error: true

      - name: Install hyperfine
        uses: $/.github/actions/binstall
        with:
          packages: hyperfine@1.18.0

      - name: Install just
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: just

      - name: Prepare benchmark targets
        shell: bash
        timeout-minutes: 50
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [ "$SCENARIO" = isolated-linker.peer-heavy-resolve.hot-cache.offline ]; then
            BENCHMARK_BUILD_TARGETS="$BENCHMARK_BUILD_TARGETS pnpm@HEAD"
          fi
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --build-only --registry=npm $BENCHMARK_BUILD_TARGETS

      - name: 'Benchmark: Isolated linker: fresh restore, cold cache + cold store'
        if: matrix.scenario == 'isolated-linker.fresh-restore.cold-cache.cold-store'
        shell: bash
        # Hyperfine has no per-command timeout, so a single hanging
        # install takes the whole step down with the GHA default job
        # timeout (6 h). 15 min is generous headroom for the warmup +
        # timed runs across all four commands (cold client store, so each
        # iteration re-fetches — pacquet from the registry, pnpr from its
        # warm server), and a failure surfaces fast enough to iterate on.
        timeout-minutes: 15
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.fresh-restore.cold-cache.cold-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE.json

      - name: 'Benchmark: Isolated linker: fresh restore, hot cache + hot store'
        if: matrix.scenario == 'isolated-linker.fresh-restore.hot-cache.hot-store'
        shell: bash
        # Same timeout rationale as the cold-cache step above. Each
        # timed run wipes only `node_modules`; the per-revision client
        # store survives, and hyperfine's warmup populates it on the first
        # iteration so timed runs all see a hot client store (and a warm
        # server, as in every scenario).
        timeout-minutes: 15
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.fresh-restore.hot-cache.hot-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_HOT_CACHE_HOT_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_HOT_CACHE_HOT_STORE.json

      - name: 'Benchmark: Isolated linker: repeat install, hot cache + hot store'
        if: matrix.scenario == 'isolated-linker.repeat-install.hot-cache.hot-store'
        shell: bash
        # Populated, up-to-date `node_modules`: nothing is wiped between
        # iterations, so the timed command is the repeat-install
        # short-circuit ("Already up to date"). Guards pnpm/pnpm#13904 —
        # the harness asserts pnpr@HEAD is not slower than pacquet@HEAD
        # here, since a configured pnpr server must cost nothing when
        # there is nothing to resolve. Cheapest scenario per iteration.
        timeout-minutes: 15
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.repeat-install.hot-cache.hot-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_HOT_CACHE_HOT_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_HOT_CACHE_HOT_STORE.json

      - name: 'Benchmark: Isolated linker: repeat install, cold cache + hot store'
        if: matrix.scenario == 'isolated-linker.repeat-install.cold-cache.hot-store'
        shell: bash
        # Same populated repeat install with `cache-dir` wiped per
        # iteration: the up-to-date answer must be reached without any
        # metadata or verification-cache reads, so a cold cache may not
        # slow it down (same pnpm/pnpm#13904 gate as the hot variant).
        timeout-minutes: 15
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.repeat-install.cold-cache.hot-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_COLD_CACHE_HOT_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_COLD_CACHE_HOT_STORE.json

      - name: 'Benchmark: Isolated linker: fresh install, cold cache + cold store'
        if: matrix.scenario == 'isolated-linker.fresh-install.cold-cache.cold-store'
        shell: bash
        # No-lockfile scenario: a fresh resolution runs longer than the
        # restore steps (pacquet resolves against the registry,
        # pnpm/pnpm#11832; pnpr offloads it to its server). 35 min leaves
        # headroom for the default hyperfine 1 warmup + 10 timed runs
        # across all four commands without losing the per-command timeout
        # safety net the other steps document.
        timeout-minutes: 35
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.fresh-install.cold-cache.cold-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_COLD_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_COLD_STORE.json

      - name: 'Benchmark: Isolated linker: fresh install, hot cache + hot store'
        if: matrix.scenario == 'isolated-linker.fresh-install.hot-cache.hot-store'
        shell: bash
        # Same timeout rationale as the cold-cache install step above; the
        # hot client store makes each iteration cheaper, so 25 min is
        # ample headroom across all four commands.
        timeout-minutes: 25
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.fresh-install.hot-cache.hot-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_HOT_CACHE_HOT_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_HOT_CACHE_HOT_STORE.json

      - name: 'Benchmark: Isolated linker: fresh install, cold cache + hot store'
        if: matrix.scenario == 'isolated-linker.fresh-install.cold-cache.hot-store'
        shell: bash
        # Isolates resolution: a cold packument cache forces a full
        # re-resolve (a fetch waterfall over the registry link), but the hot
        # store means no tarball download dominates and hides it. This is
        # the scenario that exposes pnpr's resolution-offload win — a direct
        # install pays the cold resolution while pnpr offloads it to its warm
        # server. Cheap per iteration (no download), so 25 min is ample.
        timeout-minutes: 25
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.fresh-install.cold-cache.hot-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_HOT_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_HOT_STORE.json

      - name: 'Benchmark: Isolated linker: fresh resolve, hot cache, offline'
        if: matrix.scenario == 'isolated-linker.fresh-resolve.hot-cache.offline'
        shell: bash
        # Offline re-resolution from the warm on-disk packument mirror:
        # `install --offline --lockfile-only` with the lockfile removed per
        # iteration (an online pre-warm pass primes the mirror first). No
        # network and no linking, so the timed work is almost purely mirror
        # reads + packument parsing — the series that guards offline /
        # prefer-offline resolution, e.g. the disk-to-memory metadata
        # promotion of pnpm/pnpm#12760. Cheapest scenario per iteration, so
        # 15 min is ample.
        timeout-minutes: 15
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.fresh-resolve.hot-cache.offline --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESOLVE_HOT_CACHE_OFFLINE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESOLVE_HOT_CACHE_OFFLINE.json

      - name: 'Benchmark: Isolated linker: peer-heavy resolve, hot cache, offline'
        if: matrix.scenario == 'isolated-linker.peer-heavy-resolve.hot-cache.offline'
        id: peer_heavy
        shell: bash
        # Bit-style dependency DAG whose shared subgraphs expand into many
        # peer-resolution occurrences. The online lockfile-only pass primes
        # each target's metadata mirror; timed runs remove the generated
        # lockfile and resolve offline, isolating peer discovery and resolution.
        #
        # This fixture's run-to-run spread is wide — a local 15-run pass
        # measured a ~15% coefficient of variation on an idle machine, with the
        # slow samples scattered through the sequence rather than clustered at
        # the start, so the noise is contention rather than a cold cache and
        # extra warmups would not help. What helps is more samples: the guard
        # and the reported metric both read the *fastest* run, so nine runs
        # give that minimum a good chance of landing on an uncontended one.
        #
        # The cross-engine ratio assertion inside the harness is a gate, not a
        # measurement, and it must not cost us the measurement: failing inside
        # the job aborts it before the Bencher upload, which drops *every*
        # scenario's data point for the run, not just this one's. Record the
        # verdict here and re-raise it in the report job after the upload.
        continue-on-error: true
        timeout-minutes: 30
        run: |
          status=0
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.peer-heavy-resolve.hot-cache.offline --runs=9 --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $PEER_HEAVY_BENCHMARK_TARGETS || status=$?
          # hyperfine exports both reports before the harness asserts, so a
          # failed gate still leaves a full measurement to publish. A failure
          # before hyperfine leaves nothing, and the Bencher build step's jq
          # then fails the job on the missing input — which is what we want.
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_PEER_HEAVY_RESOLVE_HOT_CACHE_OFFLINE.md || true
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_PEER_HEAVY_RESOLVE_HOT_CACHE_OFFLINE.json || true
          exit $status

      - name: 'Benchmark: Isolated linker: fresh restore, cold cache + cold store + cold pnpr'
        if: matrix.scenario == 'isolated-linker.fresh-restore.cold-cache.cold-store.cold-pnpr'
        shell: bash
        # The only scenario with a cold pnpr-side cache: the per-revision mock
        # starts empty each iteration and refetches every tarball from the warm
        # origin, exercising the proxy's cold download/serve path (which streams
        # rather than buffering the full tarball before serving). Frozen so it's
        # just tarball serving — no resolution noise — and both arms measure it.
        # Most expensive scenario (every iteration re-downloads ~1300 tarballs
        # through the mock), so it gets the same generous timeout as a fresh
        # install.
        timeout-minutes: 35
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=isolated-linker.fresh-restore.cold-cache.cold-store.cold-pnpr --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE_COLD_PNPR.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE_COLD_PNPR.json

      - name: 'Benchmark: GVS linker: fresh restore, hot cache + hot store'
        if: matrix.scenario == 'gvs-linker.fresh-restore.hot-cache.hot-store'
        shell: bash
        # The layout pnpm 12 installs into by default, which no other
        # scenario measures — every `isolated-linker.*` fixture pins
        # `enableGlobalVirtualStore: false`.
        #
        # Same frozen install as the isolated fresh-restore hot/hot
        # scenario, against the same warm cache and store, so the pair
        # brackets what the layout is worth: the per-iteration wipe takes
        # `node_modules` either way, but under the shared store the
        # materialized package directories live outside it and survive,
        # leaving symlinking as the measured work. Locally that is ~190 ms
        # against ~1.05 s for the isolated scenario, so this is also the
        # scenario where a regression in slot reuse would show up as a
        # jump toward that isolated number.
        #
        # The harness pre-warms the shared store per target before
        # hyperfine starts, because the scenario's contract is a
        # populated GVS and the pre-benchmark wipe empties it.
        timeout-minutes: 15
        run: |
          target/debug/integrated-benchmark --reuse-prebuilt-binaries --scenario=gvs-linker.fresh-restore.hot-cache.hot-store --registry=verdaccio --pnpr-latency-ms=${PNPR_LATENCY_MS} --registry-latency-ms=${REGISTRY_LATENCY_MS} --registry-bandwidth-mbps=${REGISTRY_BANDWIDTH_MBPS} $BENCHMARK_TARGETS
          cp bench-work-env/BENCHMARK_REPORT.md bench-work-env/BENCHMARK_REPORT_GVS_FRESH_RESTORE_HOT_CACHE_HOT_STORE.md
          cp bench-work-env/BENCHMARK_REPORT.json bench-work-env/BENCHMARK_REPORT_GVS_FRESH_RESTORE_HOT_CACHE_HOT_STORE.json

      # When a scenario fails, hyperfine aborts and the benchmarked install's
      # own output is invisible: each target's script redirects stdout+stderr to
      # `bench-work-env/<target>/BENCHMARK_OUTPUT.ndjson` (to keep hyperfine's
      # timing clean), so `--show-output` shows nothing. Dump those logs and the
      # per-revision pnpr server logs so the real install error reaches the CI
      # log for diagnosis.
      - name: Dump benchmark install output on failure
        # `steps.peer_heavy` swallows its own failure so the upload can run, so
        # `failure()` alone would skip these logs for the one scenario whose
        # gate is deferred.
        if: failure() || steps.peer_heavy.outcome == 'failure'
        shell: bash
        run: |
          shopt -s nullglob
          for log in bench-work-env/*/BENCHMARK_OUTPUT.ndjson; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
          for log in bench-work-env/*/revision-mock.stderr.log bench-work-env/*/pnpr-server.stderr.log; do
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done
          # Opt-in: only produces output when a run passed `--serve-timing`
          # (kept off by default so debug-logging overhead never skews the timed
          # means). When on, pnpr logs its `pnpr::serve_timing` events to *stdout*
          # (tracing_subscriber's default writer), so aggregate those logs — not
          # stderr — into a compact per-phase profile (count, total ms, mean µs)
          # so a cold-store serve cost is visible without scrolling.
          for log in bench-work-env/*/revision-mock.stdout.log bench-work-env/*/pnpr-server.stdout.log; do
            if grep -q "pnpr::serve_timing" "$log"; then
              echo "::group::$log (serve_timing per-phase summary)"
              sed -E 's/\x1b\[[0-9;]*m//g' "$log" | grep -oE 'phase="[^"]+".*elapsed_us=[0-9]+' \
                | sed -E 's/phase="([^"]+)".*elapsed_us=([0-9]+)/\1 \2/' \
                | awk '{n[$1]++; sum[$1]+=$2} END {for (p in n) printf "%-28s count=%-7d total_ms=%-10.1f mean_us=%.0f\n", p, n[p], sum[p]/1000, sum[p]/n[p]}' \
                | sort
              echo "::endgroup::"
            fi
          done

      - name: Record peer-heavy gate result
        if: always() && matrix.scenario == 'isolated-linker.peer-heavy-resolve.hot-cache.offline'
        env:
          OUTCOME: ${{ steps.peer_heavy.outcome }}
        run: |
          mkdir -p bench-work-env
          echo "$OUTCOME" > bench-work-env/peer-heavy-outcome.txt

      - name: Upload scenario results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrated-benchmark-scenario-${{ matrix.os }}-${{ matrix.scenario }}
          path: |
            bench-work-env/BENCHMARK_REPORT_*.md
            bench-work-env/BENCHMARK_REPORT_*.json
            bench-work-env/peer-heavy-outcome.txt
          if-no-files-found: error
          retention-days: 1

  report:
    needs: [revisions, benchmark]
    name: Combine benchmark results
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revisions.outputs.head_sha }}
          persist-credentials: false

      - name: Download scenario results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integrated-benchmark-scenario-blacksmith-8vcpu-ubuntu-2404-*
          path: bench-work-env
          merge-multiple: true

      - name: Generate summary
        shell: bash
        env:
          # The PR head SHA for pull_request events, otherwise (push,
          # workflow_dispatch) the ref's own SHA. Display-only — no
          # control flow consumes it; the comment workflow resolves the
          # PR number from the trusted workflow_run payload regardless.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          (
            echo '## Integrated-Benchmark Report (${{ runner.os }})'
            echo
            echo "**Commit:** [\`${SHA:0:12}\`](${{ github.server_url }}/${{ github.repository }}/commit/$SHA)"
            echo
            echo 'Regular scenarios report direct and pnpr installs. The peer-heavy resolver scenario compares current Rust, main Rust, and TypeScript pnpm. Bencher consumes pacquet@HEAD and pnpr@HEAD.'
            echo
            echo 'The tables below show mean ± σ; Bencher thresholds on the **minimum** latency, which is far less perturbed by shared-runner contention (noise only adds time).'
            echo
            echo '### Scenario: Isolated linker: fresh restore, cold cache + cold store'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: fresh restore, hot cache + hot store'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_HOT_CACHE_HOT_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_HOT_CACHE_HOT_STORE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: repeat install, hot cache + hot store'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_HOT_CACHE_HOT_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_HOT_CACHE_HOT_STORE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: repeat install, cold cache + hot store'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_COLD_CACHE_HOT_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_REPEAT_INSTALL_COLD_CACHE_HOT_STORE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: fresh install, cold cache + cold store'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_COLD_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_COLD_STORE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: fresh install, hot cache + hot store'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_HOT_CACHE_HOT_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_HOT_CACHE_HOT_STORE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: fresh install, cold cache + hot store'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_HOT_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_INSTALL_COLD_CACHE_HOT_STORE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: fresh resolve, hot cache, offline'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESOLVE_HOT_CACHE_OFFLINE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESOLVE_HOT_CACHE_OFFLINE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: peer-heavy resolve, hot cache, offline'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_PEER_HEAVY_RESOLVE_HOT_CACHE_OFFLINE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_PEER_HEAVY_RESOLVE_HOT_CACHE_OFFLINE.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: Isolated linker: fresh restore, cold cache + cold store + cold pnpr'
            echo
            cat bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE_COLD_PNPR.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE_COLD_PNPR.json
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### Scenario: GVS linker: fresh restore, hot cache + hot store'
            echo
            echo 'Same install as the isolated fresh-restore hot/hot scenario, into the shared virtual store, the layout pnpm 12 installs into by default. Scenarios run on separate machines, so compare main and branch within each table.'
            echo
            cat bench-work-env/BENCHMARK_REPORT_GVS_FRESH_RESTORE_HOT_CACHE_HOT_STORE.md
            echo
            echo '<details><summary>BENCHMARK_REPORT.json</summary>'
            echo
            echo '```json'
            jq 'del(.results[].exit_codes, .results[].times)' bench-work-env/BENCHMARK_REPORT_GVS_FRESH_RESTORE_HOT_CACHE_HOT_STORE.json
            echo '```'
            echo
            echo '</details>'
          ) > bench-work-env/SUMMARY.md

      - name: Build Bencher-shaped report
        # Convert the scenario JSONs into a Bencher Metric Format (BMF) file
        # per testbed, keeping only the chosen target's result from each
        # scenario and naming each benchmark after the scenario. Regular
        # scenarios contribute both testbeds; the client-only peer-heavy case
        # contributes only `pacquet@HEAD`.
        #
        # We report each scenario's *minimum* latency as the metric value, so
        # Bencher's threshold tracks the min rather than the mean. On a shared
        # CI runner, contention only ever *adds* time, so the minimum is the run
        # least perturbed by a noisy neighbour and the truest signal of a real
        # code regression — the mean drifts run-to-run with whatever else the
        # machine is doing (the latency-free offline scenario is pure CPU/disk
        # and swung ~30% between runs, tripping a spurious alert on a control
        # run whose HEAD and main binaries were byte-identical). Because the
        # minimum only needs one uncontended run, hyperfine's default sampling
        # suffices for regular scenarios. The peer-heavy case is noisier and
        # fixes its own count instead. The human-readable
        # comment still reports mean ± σ; only the alerting signal moves to the
        # min.
        #
        # BMF rather than the `shell_hyperfine` adapter with a doctored `mean`:
        # this reports the min honestly as the value instead of relabelling it.
        # `value` is in nanoseconds (`min` seconds × 1e9) to match the unit the
        # `shell_hyperfine` adapter established for the `latency` measure, so
        # the existing baseline stays comparable. The uploads that consume
        # these files therefore use `--adapter json`.
        shell: bash
        run: |
          # Build one BMF bencher-results file: $1 = output path, $2 = the
          # hyperfine command name to keep, $3.. = `FILE_TAG:scenario-name`
          # entries.
          build_bencher_file() {
            local out=$1 command=$2
            shift 2
            local inputs=()
            local entry file_tag name src dst
            for entry in "$@"; do
              file_tag="${entry%%:*}"
              name="${entry#*:}"
              src="bench-work-env/BENCHMARK_REPORT_${file_tag}.json"
              dst="bench-work-env/${name}-${command}-bencher.json"
              jq --arg s "$name" --arg c "$command" \
                '(first(.results[] | select(.command == $c))
                  // error("missing hyperfine result for \($c) in \($s)"))
                  | {($s): {latency: {value: (.min * 1e9)}}}' \
                "$src" > "$dst"
              inputs+=("$dst")
            done
            jq -s 'add' "${inputs[@]}" > "$out"
          }

          build_bencher_file bench-work-env/bencher-results.json pacquet@HEAD \
            'ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE:isolated-linker.fresh-restore.cold-cache.cold-store' \
            'ISOLATED_FRESH_RESTORE_HOT_CACHE_HOT_STORE:isolated-linker.fresh-restore.hot-cache.hot-store' \
            'ISOLATED_REPEAT_INSTALL_HOT_CACHE_HOT_STORE:isolated-linker.repeat-install.hot-cache.hot-store' \
            'ISOLATED_REPEAT_INSTALL_COLD_CACHE_HOT_STORE:isolated-linker.repeat-install.cold-cache.hot-store' \
            'ISOLATED_FRESH_INSTALL_COLD_CACHE_COLD_STORE:isolated-linker.fresh-install.cold-cache.cold-store' \
            'ISOLATED_FRESH_INSTALL_HOT_CACHE_HOT_STORE:isolated-linker.fresh-install.hot-cache.hot-store' \
            'ISOLATED_FRESH_INSTALL_COLD_CACHE_HOT_STORE:isolated-linker.fresh-install.cold-cache.hot-store' \
            'ISOLATED_FRESH_RESOLVE_HOT_CACHE_OFFLINE:isolated-linker.fresh-resolve.hot-cache.offline' \
            'ISOLATED_PEER_HEAVY_RESOLVE_HOT_CACHE_OFFLINE:isolated-linker.peer-heavy-resolve.hot-cache.offline' \
            'ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE_COLD_PNPR:isolated-linker.fresh-restore.cold-cache.cold-store.cold-pnpr' \
            'GVS_FRESH_RESTORE_HOT_CACHE_HOT_STORE:gvs-linker.fresh-restore.hot-cache.hot-store'

          build_bencher_file bench-work-env/bencher-results-pnpr.json pnpr@HEAD \
            'ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE:isolated-linker.fresh-restore.cold-cache.cold-store' \
            'ISOLATED_FRESH_RESTORE_HOT_CACHE_HOT_STORE:isolated-linker.fresh-restore.hot-cache.hot-store' \
            'ISOLATED_REPEAT_INSTALL_HOT_CACHE_HOT_STORE:isolated-linker.repeat-install.hot-cache.hot-store' \
            'ISOLATED_REPEAT_INSTALL_COLD_CACHE_HOT_STORE:isolated-linker.repeat-install.cold-cache.hot-store' \
            'ISOLATED_FRESH_INSTALL_COLD_CACHE_COLD_STORE:isolated-linker.fresh-install.cold-cache.cold-store' \
            'ISOLATED_FRESH_INSTALL_HOT_CACHE_HOT_STORE:isolated-linker.fresh-install.hot-cache.hot-store' \
            'ISOLATED_FRESH_INSTALL_COLD_CACHE_HOT_STORE:isolated-linker.fresh-install.cold-cache.hot-store' \
            'ISOLATED_FRESH_RESOLVE_HOT_CACHE_OFFLINE:isolated-linker.fresh-resolve.hot-cache.offline' \
            'ISOLATED_FRESH_RESTORE_COLD_CACHE_COLD_STORE_COLD_PNPR:isolated-linker.fresh-restore.cold-cache.cold-store.cold-pnpr' \
            'GVS_FRESH_RESTORE_HOT_CACHE_HOT_STORE:gvs-linker.fresh-restore.hot-cache.hot-store'

      - name: Stage artifact contents
        # The artifact carries the rendered report plus the
        # Bencher-shaped JSON consumed by the comment-posting
        # workflow. The PR number and runner OS are derived from the
        # trusted workflow_run event payload in that workflow, not
        # from fork-controlled artifact contents.
        #
        # The raw per-scenario hyperfine exports ride along too: they
        # keep the per-run sample distributions that the summary's
        # embedded JSON strips to stay under GitHub's comment size
        # limit, so noise investigations still have the full data.
        shell: bash
        run: |
          mkdir -p benchmark-artifact
          cp bench-work-env/SUMMARY.md benchmark-artifact/SUMMARY.md
          cp bench-work-env/BENCHMARK_REPORT_*.json benchmark-artifact/
          cp bench-work-env/bencher-results.json benchmark-artifact/bencher-results.json
          cp bench-work-env/bencher-results-pnpr.json benchmark-artifact/bencher-results-pnpr.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrated-benchmark-report-ubuntu-latest
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Install Bencher CLI
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12

      - name: Upload results to Bencher
        # Runs on push and workflow_dispatch — both execute in the
        # base-repo privilege context where secrets are available.
        # PR runs (including from forks) skip this step and upload
        # via the workflow_run comment workflow instead.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ -z "${BENCHER_API_TOKEN:-}" ]; then
            echo "::notice::BENCHER_API_TOKEN not set, skipping Bencher upload"
            exit 0
          fi
          # One run is one benchmark, two testbeds: `pacquet` (direct
          # install, all scenarios) and `pnpr` (accelerated path, hot
          # scenarios). Upload each from its own bencher-results file.
          # `--start-point-clone-thresholds` so the forked branch inherits
          # the threshold configured on main; `--err` so the workflow fails
          # when a sample breaches the upper boundary. Main pushes skip
          # both — by then the regression has already landed.
          upload() {
            local testbed=$1 file=$2
            if [ ! -f "$file" ]; then
              echo "::notice::$file not found, skipping $testbed upload"
              return 0
            fi
            local args=(
              --project pnpm
              --testbed "$testbed"
              --adapter json
              --file "$file"
              --github-actions "$GITHUB_TOKEN"
            )
            if [ "$REF_NAME" = "main" ]; then
              args+=(--branch main)
            else
              args+=(
                --branch "$REF_NAME"
                --start-point main
                --start-point-reset
                --start-point-clone-thresholds
                --err
              )
            fi
            bencher run "${args[@]}"
          }
          upload pacquet bench-work-env/bencher-results.json
          upload pnpr bench-work-env/bencher-results-pnpr.json

      - name: Re-raise the peer-heavy gate
        # Deferred from the peer-heavy step so its cross-engine assertion
        # cannot abort the job before the run's data points are published.
        # Runs even when an earlier step failed, so the gate is never skipped.
        if: always()
        shell: bash
        run: |
          if [ "$(cat bench-work-env/peer-heavy-outcome.txt)" != success ]; then
            echo "::error::The peer-heavy benchmark step failed; see its log for the assertion or build error."
            exit 1
          fi
