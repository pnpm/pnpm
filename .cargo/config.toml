[alias]
# Do not append `--` or it will break IDEs
codecov = "llvm-cov nextest --workspace --exclude pnpm-integrated-benchmark --exclude pnpm-micro-benchmark --exclude pnpm-registry-mock --ignore-filename-regex tasks"

[target.powerpc64le-unknown-linux-gnu]
# cross's binutils 2.26 mislinks calls to optional libc symbols such as gettid.
# Use Rust's bundled LLD while retaining the cross image's libc baseline.
rustflags = ["-C", "link-arg=-B.github/scripts/rust-lld"]

[target.wasm32-wasip1-threads]
rustflags = ["--cfg", "tokio_unstable"]

# >>> pnpm-managed cargo sources >>>
[[include]]
path = "../.pnpm/crates/config.toml"
optional = true
