# https://github.com/crate-ci/typos
# cargo install typos-cli
# typos

[files]
extend-exclude = [
  # Generated JavaScript contains minified dependency identifiers.
  "pnpm/crates/deps-restorer/src/cas-loader.mjs.inc",
  # Generated SVG IDs and partial terminal-animation frames are not prose.
  "pnpm/docs/static/img/logos/pnpm-light-no-text.svg",
  "pnpm/docs/static/img/demos/pnpm-install.svg",
  "pnpm/crates/crypto-shasums-file/src/node_release_keys/*.asc",
  "pnpm/tasks/micro-benchmark/fixtures/lodash.json",
]

[default.extend-words]
cafs   = "cafs"
ect    = "ect"
intoto = "intoto"
pn     = "pn"

[default.extend-identifiers]
PnP = "PnP"
