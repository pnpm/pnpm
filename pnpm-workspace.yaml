include:
  ./.config/pnpm/policies.yaml:
    - allowBuilds
    - auditConfig
    - minimumReleaseAge
    - minimumReleaseAgeExclude
    - minimumReleaseAgeExcludePrune
    - overrides
    - packageExtensions
    - registries
    - trustPolicy
    - trustPolicyExclude
    - trustPolicyExcludePrune
    - trustPolicyIgnoreAfter
  ./.config/pnpm/patches/patches.yaml:
    - patchedDependencies
    - patchesDir
  ./.config/pnpm/catalog.yaml:
    - catalogMode
    - catalogPrune
    - catalogs
    - update
  ./.config/pnpm/tasks.yaml:
    - concurrencyGroups
    - pipelines
    - tasks

# Native workspace release management (consumed by `pnpm change` / `pnpm version -r`).
# The Rust CLI wrapper is the workspace package `pacquet` (published to npm as
# `pnpm`); generate-packages.mjs rewrites the name at pack time.
versioning:
  # @pnpm/logger is a workspace package, but every consumer depends on the
  # published one through the `^1100.0.0` catalog entry (a `catalog:` peer, kept
  # deliberately so Jest loads the published CJS-bole logger — see the `bole`
  # note in the catalog). The release engine would otherwise reject those
  # catalog: peers as internal ranges that must use the workspace: protocol, so
  # freeze @pnpm/logger from the automated release: it is bumped out of band.
  ignore:
    - '@pnpm/logger'
  # Groups that always release together at one shared version:
  #   - the Rust CLI wrapper and its NAPI addon;
  #   - the pnpr wrapper and the web UI it serves;
  #   - the pnpm CLI with its prebuilt executable (@pnpm/exe) and the
  #     per-platform binary packages under pnpm11/pnpm/artifacts/. Those ship the
  #     same build and must carry the CLI's exact version.
  fixed:
    - [ 'pacquet', '@pnpm/napi' ]
    - [ '@pnpm/pnpr', '@pnpm/pnpr-ui' ]
    - [ 'pnpm', '@pnpm/exe', '@pnpm/macos-arm64', '@pnpm/linux-arm64', '@pnpm/linux-x64', '@pnpm/linuxstatic-x64', '@pnpm/win-arm64', '@pnpm/win-x64' ]
  # The TypeScript CLI (`pnpm`) leads an epic that bands every library package
  # under pnpm11/ to the CLI's major: while `pnpm` is on major 11 the libraries
  # live in majors 1100-1199. Members move independently inside the band (patch,
  # minor, and an in-band major); the release engine rejects a bump that would
  # carry one past the band ceiling, and re-bases every member to the next band
  # floor when the CLI crosses to a new stable major. The built release
  # artifacts under pnpm11/pnpm/artifacts/ are excluded from the band — they ride
  # the CLI's exact version through the fixed group above.
  epics:
    - lead: pnpm
      packages:
        - './pnpm11/**'
        - '!./pnpm11/pnpm/artifacts/**'
  lanes:
    '@pnpm/pnpr': alpha
    '@pnpm/pnpr-ui': alpha

cargo:
  enabled: true

enablePrePostScripts: false

engineStrict: false

gitChecks: false

hoistPattern:
  - jest-runner

lockfile:
  includeResolutionSettings: true

nodeVersion: 22.13.0

publishBranch: main

resolutionMode: lowest-direct

savePrefix: ''

virtualStoreType: global

autoDedupe: true
