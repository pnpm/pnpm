<!doctype html>
<meta charset="utf-8">
<title>pnpm WebContainer e2e</title>
<script type="module">
import { WebContainer } from '/webcontainer-api/index.js'

let webcontainer

window.boot = async () => {
  webcontainer = await WebContainer.boot({ workdirName: 'project' })
}

window.mountPnpm = async (files) => {
  for (const file of files) {
    const dir = file.split('/').slice(0, -1).join('/')
    await webcontainer.fs.mkdir(`pnpm/${dir}`, { recursive: true })
    const content = new Uint8Array(await (await fetch(`/pnpm/${file}`)).arrayBuffer())
    await webcontainer.fs.writeFile(`pnpm/${file}`, content)
  }
}

window.writeFile = async (path, content) => {
  const dir = path.split('/').slice(0, -1).join('/')
  if (dir) await webcontainer.fs.mkdir(dir, { recursive: true })
  await webcontainer.fs.writeFile(path, content)
}

window.run = async (command, args, cwd) => {
  const proc = await webcontainer.spawn(command, args, { cwd, terminal: { cols: 200, rows: 50 } })
  let output = ''
  const drained = proc.output.pipeTo(new WritableStream({
    write (chunk) {
      output += chunk
    },
  }))
  const exitCode = await proc.exit
  await drained
  return { exitCode, output }
}

window.ready = true
</script>
