[package]
name = "pnpm-testing-utils"
version = "0.0.0"
description = "Common utilities to test pacquet code"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The `SQLite` misuse counter, for a test that watches libsql's own error log.
libsql = ["dep:libsql"]

[dependencies]
assert_cmd = { workspace = true }
axum = { workspace = true }
command-extra = { workspace = true }
dunce = { workspace = true }
flate2 = { workspace = true }
libsql = { workspace = true, optional = true }
pipe-trait = { workspace = true }
pnpr = { workspace = true }
rustls = { workspace = true }
same-file = { workspace = true }
serde_json = { workspace = true }
ssri = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
text-block-macros = { workspace = true }
pnpr-fixtures = { workspace = true }
pnpm-fs = { workspace = true }

pnpm-workspace-state = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "signal"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
