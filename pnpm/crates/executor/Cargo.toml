[package]
name = "pnpm-executor"
version = "0.0.1"
publish = false
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pnpm-fs = { workspace = true }
pnpm-package-manifest = { workspace = true }
pnpm-reporter = { workspace = true }

derive_more = { workspace = true }
dunce = { workspace = true }
miette = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
which = { workspace = true }
deno_task_shell = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "signal"] }

[target.'cfg(target_family = "wasm")'.dependencies]
pnpm-which = { workspace = true }
pnpm-process = { path = "../process" }

[lints]
workspace = true
