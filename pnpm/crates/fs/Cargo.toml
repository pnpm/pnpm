[package]
name = "pnpm-fs"
description = "Filesystem utility functions used by pacquet"
version = "0.0.1"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[features]
test = []

[dependencies]
pnpm-ffi-fs = { workspace = true }
pnpm-signal-registry = { workspace = true }
dashmap = { workspace = true }
derive_more = { workspace = true }
dunce = { workspace = true }
getrandom = { workspace = true }
miette = { workspace = true }
pathdiff = { workspace = true }
pnpm-crypto-hash = { workspace = true }
reflink-copy = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pipe-trait = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies]
pnpm-ffi-process = { workspace = true }
libc = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
pnpm-ffi-signal = { workspace = true }

[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
same-file = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(unix, windows))'.dev-dependencies]
pnpm-testing-utils = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
pnpm-ffi-webcontainer = { path = "../ffi-webcontainer" }
pnpm-wasm-host = { path = "../wasm-host" }

[lints]
workspace = true
