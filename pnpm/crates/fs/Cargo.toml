[package]
name = "pnpm-fs"
description = "Filesystem utility functions used by pacquet"
version = "0.0.1"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[features]
test = []

[dependencies]
derive_more = { workspace = true }
dunce = { workspace = true }
getrandom = { workspace = true }
miette = { workspace = true }
pathdiff = { workspace = true }
pnpm-crypto-hash = { workspace = true }
reflink-copy = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
same-file = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Security"] }

[lints]
workspace = true
