# Prose linting. The rules live in .vale/styles/pnpm, and each one links
# the guideline it enforces.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = pnpm
pnpm.Emphasis = NO
pnpm.History = NO
pnpm.InsteadOf = NO
pnpm.Internals = NO
pnpm.Reasoning = NO
pnpm.ReleaseLine = NO
# Contributor text is held to the user-facing rules except these, which
# are not yet fixed across it.
pnpm.Dashes = warning
pnpm.Headings = warning

[{pnpm,pnpm11,pnpr}/docs/**/*.md]
pnpm.Dashes = warning
pnpm.Headings = error
pnpm.Internals = YES

[.changeset/*.md]
pnpm.Dashes = error
pnpm.Emphasis = YES
pnpm.Headings = NO
pnpm.InsteadOf = YES
pnpm.Internals = YES
pnpm.Reasoning = YES
pnpm.ReleaseLine = YES

[*.{rs,ts}]
BasedOnStyles = pnpm
pnpm.Dashes = warning
pnpm.Ellipses = NO
pnpm.Emphasis = NO
pnpm.Headings = NO
pnpm.InsteadOf = NO
pnpm.Internals = NO
pnpm.LinkText = NO
pnpm.Reasoning = NO
pnpm.ReleaseLine = NO
pnpm.Spacing = NO
pnpm.Terms = NO
