allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: true
  fuse-native: true
  ghooks: true
  msgpackr-extract: true
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    - GHSA-2g4f-4pwh-qvx6
    - GHSA-76c9-3jph-rj3q
    - GHSA-ffrw-9mx8-89p8
    - GHSA-mh29-5h37-fv8m
    - GHSA-w5hq-g745-h8pq
    # GHSA-vwc7-r8mq-g2x9: adm-zip follows pre-existing destination symlinks during
    # extraction. No patched adm-zip release exists. It is only a devDependency of
    # @pnpm/fetching.binary-fetcher, used to build zip fixtures, and never extracts.
    - GHSA-vwc7-r8mq-g2x9
    # GHSA-h67p-54hq-rp68: js-yaml quadratic-complexity DoS in merge key handling.
    # Patched only in >=4.1.2 with no v3 fix; @yarnpkg/parsers requires the js-yaml 3
    # API (yaml.safeLoad), so its transitive js-yaml cannot be upgraded.
    - GHSA-h67p-54hq-rp68
    # GHSA-vfj7-8cjw-p6xm: braces stack exhaustion on deeply nested patterns.
    # No patched braces release exists. pnpm expands patterns from the user's config
    # and command line, or from scripts and manifests of dependencies already allowed
    # to run code, so a crash gives an attacker nothing new.
    - GHSA-vfj7-8cjw-p6xm
    # GHSA-ch52-4w7c-c8xp: http-cache-semantics max-stale leaks other users'
    # responses from a shared cache. No patched release exists. make-fetch-happen
    # uses it for a private, single-user client cache, which has no other users.
    - GHSA-ch52-4w7c-c8xp
    # GHSA-hp3w-g68c-fv3c: sprintf-js DoS through unbounded precision specifiers.
    # No patched release exists. It is reached only through argparse 1, which
    # formats its own help text with it, never attacker-controlled formats.
    - GHSA-hp3w-g68c-fv3c

minimumReleaseAge: 1440 # At least a day

minimumReleaseAgeExclude:
  - '@pnpm/*'
  - '@zkochan/*'
  - better-path-resolve
  - can-link
  - can-write-to-dir
  - cmd-extension
  - comver-to-semver
  - dir-is-case-sensitive
  - '@esbuild/*'
  - glob@11.1.0
  - is-inner-link
  - is-subdir
  - make-empty-dir
  - normalize-registry-url
  - path-absolute
  - path-temp
  - pnpm
  - preferred-pm
  - promise-share
  - read-ini-file
  - read-yaml-file
  - realpath-missing
  - rename-overwrite
  - render-help
  - resolve-link-target
  - root-link-target
  - safe-execa
  - safe-promise-defer
  - symlink-dir
  - which-pm
  - write-ini-file
  - write-json5-file
  - write-yaml-file
  - http-proxy-middleware@3.0.7

minimumReleaseAgeExcludePrune: true

overrides:
  '@cypress/request@3.0.9>qs': ^6.14.1
  '@yarnpkg/fslib@2': '3'
  '@yarnpkg/nm>@yarnpkg/core': 'catalog:'
  adm-zip@<0.6.0: ^0.6.0
  ajv@>=7.0.0-alpha.0 <8.18.0: '>=8.18.0'
  body-parser@<2.2.1: '^2.2.1'
  brace-expansion@<5.0.5: '>=5.0.5'
  clipanion: 3.2.0-rc.6
  cookie@<0.7.0: '>=0.7.0'
  cross-spawn@<7.0.5: '>=7.0.5'
  debug@<3.1.0: '>=3.1.0'
  diff@<8.0.3: '^8.0.3'
  express@<4.22.1: ^4.22.1
  follow-redirects@<=1.15.5: '>=1.15.6'
  glob-parent@<5.1.2: '>=5.1.2'
  glob@>=10.3.7 <=11.0.3: '^11.1.0'
  handlebars@>=4.0.0 <4.7.9: '>=4.7.9'
  hosted-git-info@1: 'catalog:'
  istanbul-reports: npm:@zkochan/istanbul-reports
  js-yaml@<3.14.2: '^3.14.2'
  js-yaml@^4.0.0: 'catalog:'
  json5@<2.2.2: 'catalog:'
  jsonwebtoken@<=8.5.1: '>=9.0.0'
  jws@<3.2.3: '^3.2.3'
  lodash@<=4.17.23: '>=4.18.0'
  lodash@>=4.0.0 <=4.17.22: '^4.17.23'
  lodash@>=4.0.0 <=4.17.23: '>=4.18.0'
  minimatch@>=7.0.0 <7.4.7: '^7.4.7'
  minimatch@>=9.0.0 <10.0.0: '>=10.2.4'
  nopt@5: npm:@pnpm/nopt@^0.2.1
  on-headers@<1.1.0: '>=1.1.0'
  path-to-regexp@<0.1.13: ^0.1.13
  path-to-regexp@>=4.0.0 <6.3.0: '>=6.3.0'
  path-to-regexp@>=7.0.0 <8.0.0: '>=8.0.0'
  postman-request>qs: ^6.14.1
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  request: npm:postman-request@2.88.1-postman.40
  semver@<7.5.2: 'catalog:'
  send@<0.19.0: ^0.19.0
  shell-quote@<1.8.4: '>=1.8.4'
  serve-static@<1.16.0: ^1.16.0
  # GHSA-w7jw-789q-3m8p / CVE-2026-9277: 1.8.4 patches critical shell-quote vulnerabilities in <=1.8.3.
  shell-quote: 1.8.4
  socks@2: ^2.8.1
  tar@<=7.5.9: '>=7.5.10'
  tmp@<=0.2.3: '>=0.2.4'
  tough-cookie@<4.1.3: '>=4.1.3'
  validator@<13.15.22: '>=13.15.22'
  yaml@<2.2.2: '>=2.2.2'
  http-proxy-middleware@>=0.16.0 <3.0.6: ^3.0.6
  deepmerge-ts@<8.0.0: ^8.0.0

packageExtensions:
  '@babel/parser':
    peerDependencies:
      '@babel/types': '*'
  # The shell's declarations import micromatch's, which it does not depend on.
  '@yarnpkg/shell':
    dependencies:
      '@types/micromatch': ^4.0.10
  jest-circus:
    dependencies:
      slash: '3'
  remark-parse:
    dependencies:
      vfile: ^6.0.0
    peerDependencies:
      unified: '*'
  remark-stringify:
    dependencies:
      vfile: ^6.0.0
    peerDependencies:
      unified: '*'

registries:
  https://registry.npmjs.org/:
    scopes:
      - '@pnpm'

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@pnpm/*'
  - '@yarnpkg/libzip@3.2.2'
  - pnpm
  - rxjs@7.8.2
  - undici-types@6.21.0

trustPolicyExcludePrune: true

trustPolicyIgnoreAfter: 10080 # 1 week
