extends: existence
message: "Check whether a period or comma would make this easier to read."
link: https://developers.google.com/style/dashes
level: error
nonword: true
tokens:
  - '[—–]'
  # Skips the `--` before a cspell directive's reason and inside a code span.
  - '(?<!cspell:(?:(?!\s--\s)[^\n])*)(?<=(?:^|\n)[^`\n]*(?:`[^`\n]*`[^`\n]*)*)\s--\s'
