extends: existence
message: "Check whether a period or comma would make this easier to read."
link: https://developers.google.com/style/dashes
level: error
nonword: true
tokens:
  - '[—–]'
  # Skips the `--` before a lint directive's reason and inside a code span.
  - '(?<!(?:eslint-disable|@ts-expect-error|@ts-ignore|cspell:)[^\n]*)(?<=(?:^|\n)[^`\n]*(?:`[^`\n]*`[^`\n]*)*)\s--\s'
