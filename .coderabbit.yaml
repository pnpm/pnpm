# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # Skip generated, vendored, and snapshot files so reviews focus on hand-written code.
  path_filters:
    - "!pnpm-lock.yaml"
    - "!Cargo.lock"
    - "!**/dist/**"
    - "!**/__fixtures__/**"
    - "!**/*.snap"
    - "!**/CHANGELOG.md"
  path_instructions:
    - path: "**/*"
      instructions: |
        Apply the review framework in .agents/skills/review-code/references/REVIEW_GUIDE.md (it is stack-agnostic). The repo's priority order — security first, performance second, then correctness and conventions — applies to every reviewer. You are one of two bots: to avoid duplicate comments, Qodo provides the primary depth on security and performance while you provide the primary depth on correctness, maintainability, and the documented conventions; always still report any security or performance issue you find. Focus your added depth on: (1) bugs and logic errors; (2) violations of the documented code style, comment rules, and engineering conventions — see AGENTS.md ("Code Style", "Comments", "Conventions") and CONTRIBUTING.md; (3) missed reuse or duplication across the monorepo. Still raise any clear security or performance problem you notice. Do not repeat issues the linters already enforce (eslint). Surface only issues tied to changed code, and name the bug or the specific documented rule that is violated.
  labeling_instructions:
    - label: "product: pnpm@11"
      instructions: "Apply only when changes are in the pnpm11/ directory (the TypeScript pnpm CLI, frozen at v11)."

knowledge_base:
  learnings:
    # Only apply learnings from this repository, not shared across other orgs/repos.
    scope: local

# Auto-label issues, where a durable area/type taxonomy actually pays off (issues are long-lived and searched).
issue_enrichment:
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: "area: lockfile"
        instructions: "Apply when the issue concerns pnpm-lock.yaml parsing, format, or handling."
      - label: "area: monorepo"
        instructions: "Apply when the issue concerns the pnpm workspace feature."
      - label: "area: lifecycle-scripts"
        instructions: "Apply when the issue concerns running package lifecycle/build scripts."
      - label: "area: peers"
        instructions: "Apply when the issue concerns peer dependency resolution."
      - label: "area: catalogs"
        instructions: "Apply when the issue concerns the catalogs feature."
      - label: "area: patching"
        instructions: "Apply when the issue concerns patching packages (pnpm patch / patchedDependencies)."
      - label: "area: resolution"
        instructions: "Apply when the issue concerns dependency resolution."
      - label: "area: supply chain security"
        instructions: "Apply when the issue concerns minimumReleaseAge, blockExoticSubdeps, build-script safety, or trust policies."
      - label: "area: config dependencies"
        instructions: "Apply when the issue concerns configDependencies."
