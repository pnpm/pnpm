# Server config for the compose deployment. The image's default command
# supplies --listen, --storage, and --cache, and the compose file supplies
# PNPR_PUBLIC_URL, so this file holds only what has no flag.

# Keys the private cache. The cache volume outlives the container, and pnpr
# refuses to start on a cache from a previous run unless a secret is set.
secret: "${PNPR_SECRET}"

# Caps the proxy cache, which anonymous reads of the public npm registry fill.
# pnpr evicts the least recently used entries beyond it.
cache:
  maxSize: ${PNPR_CACHE_MAX_SIZE:-20GB}

log:
  format: ${PNPR_LOG_FORMAT:-json}
  level: ${PNPR_LOG_LEVEL:-info}
