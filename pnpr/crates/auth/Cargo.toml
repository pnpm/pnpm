[package]
name = "pnpr-auth"
version = "0.0.1"
description = "pnpr's user and token stores: htpasswd, SQLite, and the networked SQL backends"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license-file = "../../LICENSE.md"
repository.workspace = true

[features]
backend-libsql = ["dep:libsql", "dep:pnpr-libsql", "pnpr-error/backend-libsql", "pnpr-sql/backend-libsql"]
backend-mysql = ["dep:sqlx", "sqlx/mysql", "pnpr-error/backend-mysql", "pnpr-sql/backend-mysql"]
backend-postgres = ["dep:sqlx", "sqlx/postgres", "pnpr-error/backend-postgres", "pnpr-sql/backend-postgres"]

[dependencies]
pnpr-sql = { workspace = true }
pnpm-crypto-hash = { workspace = true }
pnpm-network = { workspace = true }
p256 = { workspace = true }
serde = { workspace = true }
pnpr-config = { workspace = true }
pnpr-error = { workspace = true, features = ["server"] }
pnpr-libsql = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
libsql = { workspace = true, optional = true }
openidconnect = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-security = { workspace = true }
url = { workspace = true }
ssri = { workspace = true }

[dev-dependencies]
rustls = { workspace = true, features = ["aws-lc-rs"] }
axum = { workspace = true, features = ["form", "json"] }
futures-util = { workspace = true }
pnpm-testing-utils = { workspace = true }
pnpr-libsql = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-0-4 = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "signal"] }

[lints]
workspace = true
