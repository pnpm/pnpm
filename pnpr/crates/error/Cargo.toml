[package]
name = "pnpr-error"
version = "0.0.1"
description = "The error type every pnpr layer returns, and how it renders as an HTTP response"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license-file = "../../LICENSE.md"
repository.workspace = true

[features]
server = [
  "dep:axum",
  "dep:bcrypt",
  "dep:object_store",
  "dep:reqwest",
  "dep:rusqlite",
  "dep:serde_json",
  "dep:tokio",
  "dep:tracing",
]
backend-libsql = ["dep:libsql"]
backend-mysql = ["dep:sqlx", "sqlx/mysql"]
backend-postgres = ["dep:sqlx", "sqlx/postgres"]

[dependencies]
axum = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }
derive_more = { workspace = true }
libsql = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "signal"], optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
