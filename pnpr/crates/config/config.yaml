# Authoritative storage for hosted packages published to this server.
storage: ./storage

# Disposable proxy cache for upstream registries and the install accelerator.
# Defaults to `.pnpr-cache` under `storage`.
#cache: ./cache
#cache:
#  path: ./cache
#  maxSize: 20GB
#  maxAge: 30d

# Cross-origin browser access (disabled unless exact origins are listed).
#cors:
#  allowedOrigins:
#    - https://npmx.dev
#    - http://localhost:3000

# Reverse-proxy addresses trusted to supply client IP headers.
#trustedProxies:
#  - loopback
#  - 10.0.0.0/8
#trustedProxyHeader: x-forwarded-for

# S3-compatible object store for hosted packages.
#s3:
#  bucket: my-pnpr-packages
#  region: auto
#  endpoint: https://<account-id>.r2.cloudflarestorage.com
#  prefix: packages
#  accessKeyId: ${PNPR_S3_ACCESS_KEY_ID}
#  secretAccessKey: ${PNPR_S3_SECRET_ACCESS_KEY}
#  forcePathStyle: true   # the default unless AWS_VIRTUAL_HOSTED_STYLE_REQUEST=true; false selects virtual-hosted addressing
#  allowHttp: false

# Shared database backend for auth records (users and tokens).
# Defaults to local htpasswd + tokens.db files.
#backend:
#  libsql:
#    url: ${PNPR_LIBSQL_URL}
#    authToken: ${PNPR_LIBSQL_TOKEN}
#    replicaPath: ./auth-replica.db
#    syncIntervalSecs: 60
#  postgres:
#    url: ${PNPR_POSTGRES_URL}
#    maxConnections: 16
#  mysql:
#    url: ${PNPR_MYSQL_URL}
#    maxConnections: 16

# Secret key for resolution cache HMAC and OCI token signing.
# If omitted or commented out, a secure 32-byte CSPRNG random secret is generated on startup.
#secret: ${PNPR_SECRET}

auth:
  htpasswd:
    file: ./htpasswd
    # Maximum amount of users allowed to register. The safe default is -1
    # (registration disabled); set a non-negative cap to allow registration.
    max_users: -1

# Registries: upstream npm proxy and local hosted storage.
registries:
  # The public npm registry. Proxies and caches upstream packages.
  npmjs:
    type: upstream
    url: https://registry.npmjs.org/
    public: true

  # Hosted registry for private packages, addressable at `/~local/`.
  local:
    type: hosted
    access: $authenticated

# The path-less base URL (`https://<pnpr>/`) proxies the public npm registry.
defaultRegistry: npmjs

# Log settings.
log:
  type: stdout
  format: pretty
  level: info
