# The address to bind to, and the URL clients reach the server at. Defaults to
# 127.0.0.1:7677 and http://<listen>. The --listen and --public-url flags
# override them.
#listen: 0.0.0.0:7677
#publicUrl: https://registry.example.com

# Authoritative storage for hosted packages published to this server: a
# directory, or a table that also names the object store and the database.
storage: ./storage
#storage:
#  path: ./storage
#  # S3-compatible object store for hosted packages.
#  s3:
#    bucket: my-pnpr-packages
#    region: auto
#    endpoint: https://<account-id>.r2.cloudflarestorage.com
#    prefix: packages
#    accessKeyId: ${PNPR_S3_ACCESS_KEY_ID}
#    secretAccessKey: ${PNPR_S3_SECRET_ACCESS_KEY}
#    forcePathStyle: true   # the default unless AWS_VIRTUAL_HOSTED_STYLE_REQUEST=true; false selects virtual-hosted addressing
#    allowHttp: false
#  # Shared database for accounts, tokens, and package metadata.
#  # PostgreSQL and MySQL use the same url setting with their connection URL.
#  database:
#    url: ${PNPR_LIBSQL_URL}
#    authToken: ${PNPR_LIBSQL_TOKEN}
#    replicaPath: ./metadata-replica.db
#    syncInterval: 60s
#    maxConnections: 16

# Disposable proxy cache for upstream registries and the install accelerator.
# Defaults to `.pnpr-cache` under `storage`.
#cache: ./cache
#cache:
#  path: ./cache
#  maxSize: 20GB
#  maxAge: 30d

# The largest tarball fetched from an upstream registry. Defaults to 100MiB.
#maxTarballSize: 256MiB

# Cross-origin browser access (disabled unless exact origins are listed).
#cors:
#  allowedOrigins:
#    - https://npmx.dev
#    - http://localhost:3000

# Reverse-proxy addresses trusted to supply client IP headers.
#trustedProxies:
#  networks:
#    - loopback
#    - 10.0.0.0/8
#  header: x-forwarded-for

# Prometheus metrics (not served unless this block is present).
#metrics:
#  token: ${PNPR_METRICS_TOKEN}   # scrapers send it as a bearer token
#  listen: 127.0.0.1:9464         # serve metrics only on this address

# Secret key for private cache HMACs and OCI token signing.
# Required when the cache persists across restarts, is shared, or there are
# several replicas. When omitted on a single-instance server with an empty
# ephemeral cache, a random 32-byte CSPRNG secret is generated on startup.
#secret: ${PNPR_SECRET}

# Archive garbage collection (`pnpr gc`).
#gc:
#  lease: 1h   # how long an interrupted reclaim is left before another run takes it over

auth:
  users:
    # Maximum amount of users allowed to register. The safe default is -1
    # (registration disabled); set a non-negative cap to allow registration.
    maxUsers: -1

# Log settings.
log:
  format: pretty
  level: info
