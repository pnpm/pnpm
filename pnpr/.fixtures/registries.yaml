# The registry-mock registries, which `pnpr-prepare` and the test helpers
# store in the fixture database. `grants.yaml` says who may do what in them.
registries:
  # The locally-hosted fixtures (and anything published during tests).
  local:
    type: hosted
    packages:
      # Scopes seeded from the in-repo fixture sources (`pnpr/.fixtures/packages/`).
      '@foo/*': {}
      '@having/*': {}
      '@jsr/*': {}
      '@pnpm.e2e/*': {}
      '@private/*': {}
      '@scoped/*': {}
      'create-touch-file-one-bin': {}
      'preact-particles': {}
      # Fixture packages in real scopes claimed by exact name.
      '@pnpm/plugin-pnpmfile': {}
      '@pnpm/postinstall-modifies-source': {}
      '@pnpm/x': {}
      '@pnpm/xyz': {}
      '@pnpm/xyz-parent': {}
      '@pnpm/xyz-parent-parent': {}
      '@pnpm/xyz-parent-parent-parent': {}
      '@pnpm/xyz-parent-parent-parent-parent': {}
      '@pnpm/xyz-parent-parent-with-xyz': {}
      '@pnpm/y': {}
      '@pnpm/z': {}
      '@types/pnpm.e2e__peer-a': {}
      '@zkochan/test-pnpm-issue219': {}
      # Names tests publish to the mock and then read back.
      '@pnpmtest/*': {}
      'batch-dry-1': {}
      'batch-dry-2': {}
      'batch-no-recursive': {}
      'batch-pkg-2': {}
      'batch-unsupported-1': {}
      'project-100': {}
      'project-200': {}
      'publish_config_directory_dist_package': {}
      'test-deprecate-package': {}
      'test-deprecate-specific': {}
      'test-dist-tag-add': {}
      'test-dist-tag-add-default': {}
      'test-dist-tag-ls': {}
      'test-dist-tag-ls-default': {}
      'test-dist-tag-rm': {}
      'test-dist-tag-rm-latest': {}
      'test-dist-tag-rm-missing': {}
      'test-publish-config': {}
      'test-publish-config-directory': {}
      'test-publish-config-installation': {}
      'test-publish-helper-token-basic.json': {}
      'test-publish-helper-token-bearer.json': {}
      'test-publish-package-oidc.json': {}
      'test-publish-package.json': {}
      'test-publish-package.json5': {}
      'test-publish-package.yaml': {}
      'test-publish-scripts': {}
      'test-publish-skip-manifest-obfuscation': {}
      'test-publish-skip-manifest-obfuscation-installation': {}
      'test-publish-tarball': {}
      'test-publish-with-ignore-scripts': {}
      'test-publish-with-scripts': {}
      'test-undeprecate-pkg': {}
      'test-unpublish-force': {}
      'test-unpublish-no-force': {}
      'test-unpublish-no-ver': {}
      'test-unpublish-only-version': {}
      'test-unpublish-version': {}
      'workspace-package-with-default-catalog': {}
      'workspace-package-with-named-catalog': {}
      '@pnpm.e2e/needs-auth': {}

  # The public npm registry upstream catch-all.
  npmjs:
    type: upstream
    url: https://registry.npmjs.org/
    public: true
    # The default breaker stays open for 5m after two failures, longer than
    # pnpm's fetch retries, so one network blip fails every npm request
    # until the cooldown ends.
    maxFails: 0
    # pnpr_fixtures::REGISTRY_MOCK_UPSTREAM_TIMEOUT says why.
    timeout: 3m

  # Router combining local fixtures and upstream npm.
  main:
    type: router
    sources: [local, npmjs]

defaultRegistry: main
