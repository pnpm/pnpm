# The grants of the registry-mock registries in `registries.yaml`.
grants:
  # Anyone reads the fixtures. A signed-in caller publishes, tags and
  # unpublishes, as the tests do.
  local:
    registries: [local]
    exclude: ['@private/*', '@pnpm.e2e/needs-auth']
    subjects:
      $all: [read]
      $authenticated: [publish, annotate, delete]

  # The packages only a signed-in caller reads.
  local-private:
    registries: [local]
    include: ['@private/*', '@pnpm.e2e/needs-auth']
    subjects:
      $authenticated: [read, publish, annotate, delete]

  npmjs:
    registries: [npmjs]
    subjects:
      $all: [read, cache]
