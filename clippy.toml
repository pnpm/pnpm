# `print_stderr` and `print_stdout` guard the shipped binary against a closed stderr or stdout.
# Tests may print freely.
allow-print-in-tests = true

# A temp file placed next to its target is usually persisted over it, and these create it 0600.
disallowed-methods = [
    { path = "tempfile::NamedTempFile::new_in", reason = "use pnpm_fs::umask_named_tempfile_in or pnpm_fs::private_named_tempfile_in to choose the file's mode" },
    { path = "tempfile::Builder::tempfile_in", reason = "use pnpm_fs::umask_named_tempfile_in or pnpm_fs::private_named_tempfile_in to choose the file's mode" },
    # Exiting without releasing the Windows Job Object kills whatever the command left running (pnpm/crates/executor/PROCESS_LIFETIME.md).
    { path = "std::process::exit", reason = "use pnpm_executor::exit, which releases the process-tree cleanup first" },
    # POSIX `setenv` may reallocate `environ`, so a concurrent `getenv` can read freed memory.
    # The readers include glibc and pnpm's C dependencies, which take no Rust lock, so the
    # obligation cannot be discharged by locking: it is discharged by writing the environment
    # only while the process has one thread. Spawn a child with `Command::env` instead, or carry
    # the value as config. The two startup writes in `pnpm-cli` and the test-only
    # `pnpm_testing_utils::env_guard::EnvGuard` carry an `expect` with the reason they are sound.
    { path = "std::env::set_var", reason = "pass the variable to a child through Command::env, or carry it as config; see pnpm/crates/cli/src/env_file.rs for the one startup exception" },
    { path = "std::env::remove_var", reason = "build the child's environment with Command::env_clear/envs instead; tests use pnpm_testing_utils::env_guard::EnvGuard" },
]
