[package]
name = "pnpz"
version = "0.0.1"
publish = false
authors = ["pnpm contributors"]
description = "System packages from the Nix binary cache, without Nix"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
# tests/suite.rs declares the files under tests/ as modules of one binary.
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pnpz"
path = "src/main.rs"

[[test]]
name = "suite"
path = "tests/suite.rs"

[target.'cfg(unix)'.dependencies]
pnpm-diagnostics = { workspace = true }
pnpm-network = { workspace = true }
pnpz-nix-store = { workspace = true }

bytes = { workspace = true }
clap = { workspace = true }
derive_more = { workspace = true }
futures-util = { workspace = true }
home = { workspace = true }
lzma-rust2 = { workspace = true }
miette = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
yaml_serde = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
assert_cmd = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
mockito = { workspace = true }
pretty_assertions = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
